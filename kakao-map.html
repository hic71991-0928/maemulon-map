<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>매물on 지도</title>
<style>
  :root {
    --toss-blue: #3182f6;
    --toss-text: #191f28;
    --toss-text-sub: #4e5968;
    --toss-bg: #f9fafb;
    --toss-line: #e5e8eb;
  }
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  #topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    background: #fff;
    border-bottom: 1px solid var(--toss-line);
    font-size: 13px;
    color: var(--toss-text-sub);
  }
  #topbar strong { color: var(--toss-text); }
  #status.error { color: #f04452; }
  /* v2.105: 로드뷰를 떠 있는 작은 팝업 대신, 지도 옆에 화면을 절반씩 나눠 크게
     보여주는 방식으로 변경(밸류맵 등 참고 사이트 방식). */
  #mapWrap { display: flex; width: 100%; height: calc(100% - 37px); }
  #map { flex: 1; min-width: 0; background: var(--toss-bg); }
  #roadviewSplit {
    display: none;
    flex: 1;
    min-width: 0;
    flex-direction: column;
    border-left: 1px solid var(--toss-line);
  }
  #roadviewSplitBar {
    flex: none;
    height: 32px;
    background: rgba(0, 0, 0, 0.75);
    color: #fff;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px;
  }
  #roadviewClose { border: none; background: transparent; color: #fff; cursor: pointer; font-size: 14px; line-height: 1; padding: 2px 4px; }
  #roadviewInner { flex: 1; min-height: 0; }
  .info-window {
    padding: 8px 10px;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--toss-text);
    max-width: 220px;
  }
  .info-window b { display: block; margin-bottom: 3px; }
  .info-window button {
    margin-top: 6px;
    border: none;
    background: var(--toss-blue);
    color: #fff;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 6px;
    cursor: pointer;
  }
  /* v2.101: 색상 범례 박스를 없애고, 카카오 공식 사이트의 "지도유형"
     체크박스(위성도/지적도/지형도) + "현재위치"/"로드뷰" 버튼을 직접 만들어 대체 */
  #layerControl {
    position: absolute;
    left: 10px;
    bottom: 24px;
    background: #fff;
    border: 1px solid var(--toss-line);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12px;
    color: var(--toss-text);
    box-shadow: 0 1px 4px rgba(25, 31, 40, 0.12);
    z-index: 10;
  }
  #layerControl .layer-row { display: flex; align-items: center; gap: 6px; margin: 3px 0; cursor: pointer; }
  #layerControl .layer-row input { margin: 0; }
  #layerControl .layer-btns { display: flex; gap: 6px; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--toss-line); }
  #layerControl button {
    border: 1px solid var(--toss-line);
    background: #fff;
    color: var(--toss-text);
    font-size: 11.5px;
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
  }
  #layerControl button.active { background: var(--toss-blue); color: #fff; border-color: var(--toss-blue); }
</style>
</head>
<body>
  <div id="topbar">
    <strong>매물on 지도</strong>
    <span id="status">확장 프로그램에서 매물 데이터를 기다리는 중...</span>
  </div>
  <div id="mapWrap">
    <div id="map"></div>
    <div id="roadviewSplit">
      <div id="roadviewSplitBar">
        로드뷰 (지도 위 파란선을 클릭하면 여기가 바뀌고, 사진 안에서 이동하면 지도의 빨간 점도 같이 움직입니다)
        <button type="button" id="roadviewClose">✕</button>
      </div>
      <div id="roadviewInner"></div>
    </div>
  </div>
  <div id="layerControl">
    <label class="layer-row"><input type="checkbox" id="chkSkyview" /> 위성도</label>
    <label class="layer-row"><input type="checkbox" id="chkDistrict" checked /> 지적도</label>
    <label class="layer-row"><input type="checkbox" id="chkTerrain" /> 지형도</label>
    <div class="layer-btns">
      <button type="button" id="btnLocate">현재위치</button>
      <button type="button" id="btnRoadview">로드뷰(선택)</button>
    </div>
  </div>
  <script>
    // v2.105: 이 페이지는 GitHub Pages 같은 외부 호스팅에서 새 탭으로 열린다(확장
    // 페이지 안에서는 카카오맵 SDK 같은 원격 스크립트를 불러올 수 없어서). chrome.*
    // 기능(수정창 열기, 좌표 캐싱, 매물 데이터 조회)은 이 페이지에 없어서, manifest.json의
    // externally_connectable 설정 덕분에 chrome.runtime.sendMessage(확장ID, ...)로
    // 백그라운드 서비스 워커(background.js)와 직접 대화한다(예전엔 보이지 않아야 할
    // "다리 역할" 창을 하나 더 띄웠는데, 화면에 계속 잠깐씩 보이는 문제가 있어 이 방식으로 교체).

    // [필수 설정] 카카오 개발자 콘솔(매물지도 앱)에서 발급받은 키.
    const KAKAO_JS_KEY = "04fee5ca8c58b6d47d78a373007e8854";
    const KAKAO_REST_KEY = "f4968f8e8d8131968ea9df8ef2592638";

    const EXT_ID = new URLSearchParams(location.search).get("ext");

    const statusEl = document.getElementById("status");
    function setStatus(text, isError) {
      statusEl.textContent = text;
      statusEl.classList.toggle("error", !!isError);
    }
    function esc(v) {
      return String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    // v2.105: 확장 프로그램(background.js)에 메시지를 보내고 응답을 기다린다.
    function sendToExtension(msg) {
      return new Promise((resolve) => {
        if (!EXT_ID || !window.chrome || !chrome.runtime || !chrome.runtime.sendMessage) {
          resolve(null);
          return;
        }
        chrome.runtime.sendMessage(EXT_ID, msg, (response) => resolve(response || null));
      });
    }

    function loadKakaoSdk() {
      return new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(KAKAO_JS_KEY)}&libraries=clusterer&autoload=false`;
        s.onload = resolve;
        s.onerror = () => reject(new Error("카카오맵 SDK 로드 실패"));
        document.head.appendChild(s);
      });
    }

    async function geocodeAddress(address) {
      const res = await fetch(`https://dapi.kakao.com/v2/local/search/address.json?query=${encodeURIComponent(address)}`, {
        headers: { Authorization: `KakaoAK ${KAKAO_REST_KEY}` },
      });
      if (!res.ok) return null;
      const data = await res.json();
      const doc = data.documents && data.documents[0];
      if (!doc) return null;
      return { lat: parseFloat(doc.y), lng: parseFloat(doc.x) };
    }

    let mapInstance = null;

    async function renderListings(list) {
      setStatus(`매물 ${list.length}건 확인 중...`);
      const markers = [];
      const bounds = new kakao.maps.LatLngBounds();
      const infoWindow = new kakao.maps.InfoWindow({ removable: true });
      const updatedCoords = [];
      let failCount = 0;

      for (const rec of list) {
        const addr = rec["전체주소"];
        if (!addr) continue;
        let lat = rec.__위도;
        let lng = rec.__경도;
        if (typeof lat !== "number" || typeof lng !== "number") {
          const geo = await geocodeAddress(addr);
          if (!geo) { failCount++; continue; }
          lat = geo.lat;
          lng = geo.lng;
          updatedCoords.push({ id: rec.__매물번호, lat, lng });
        }
        const pos = new kakao.maps.LatLng(lat, lng);
        const marker = new kakao.maps.Marker({ position: pos });
        kakao.maps.event.addListener(marker, "click", () => {
          const html = `<div class="info-window">
            <b>${esc(rec["제목"] || "(제목 없음)")}</b>
            ${esc(rec["거래유형"] || "")} ${esc(rec["매물종류"] || "")}<br/>
            ${esc(addr)}
            <br/><button type="button" data-id="${esc(rec.__매물번호)}">수정창 열기</button>
          </div>`;
          infoWindow.setContent(html);
          infoWindow.open(mapInstance, marker);
        });
        markers.push(marker);
        bounds.extend(pos);
      }

      // v2.105: 정보창의 "수정창 열기" 버튼은 매번 새로 그려지므로 document 위임 방식으로
      // 한 번만 연결하고, chrome.runtime.sendMessage로 확장 프로그램에 요청만 보낸다.
      document.getElementById("map").addEventListener("click", (e) => {
        const btn = e.target.closest(".info-window button[data-id]");
        if (btn) sendToExtension({ type: "maemulon-open-edit", id: btn.dataset.id });
      });

      if (markers.length) {
        new kakao.maps.MarkerClusterer({ map: mapInstance, markers, averageCenter: true, minLevel: 6 });
        mapInstance.setBounds(bounds);
        setStatus(`총 ${markers.length}건 표시됨${failCount ? ` (주소 변환 실패 ${failCount}건 제외)` : ""}.`);
      } else {
        setStatus("지도에 표시할 매물이 없습니다(전체주소가 저장된 매물이 없거나 좌표 변환에 실패했습니다).", true);
      }

      // v2.105: 새로 변환한 좌표는 확장 프로그램에 돌려보내 chrome.storage에 캐싱하게 한다
      // (다음에 열 때는 다시 지오코딩하지 않도록).
      if (updatedCoords.length) sendToExtension({ type: "maemulon-coords-update", coords: updatedCoords });
    }

    // v2.101: 카카오 공식 사이트의 "지도유형" 체크박스(위성도/지적도/지형도)를
    // 직접 구현. 위성도는 기본지도(ROADMAP)<->위성+라벨(HYBRID) 전환, 지적도/지형도는
    // 오버레이로 켜고 끈다(지적도는 기본 체크 상태로 시작).
    function wireLayerControl() {
      const chkSkyview = document.getElementById("chkSkyview");
      const chkDistrict = document.getElementById("chkDistrict");
      const chkTerrain = document.getElementById("chkTerrain");
      chkSkyview.addEventListener("change", () => {
        mapInstance.setMapTypeId(chkSkyview.checked ? kakao.maps.MapTypeId.HYBRID : kakao.maps.MapTypeId.ROADMAP);
      });
      chkDistrict.addEventListener("change", () => {
        if (chkDistrict.checked) mapInstance.addOverlayMapTypeId(kakao.maps.MapTypeId.USE_DISTRICT);
        else mapInstance.removeOverlayMapTypeId(kakao.maps.MapTypeId.USE_DISTRICT);
      });
      chkTerrain.addEventListener("change", () => {
        if (chkTerrain.checked) mapInstance.addOverlayMapTypeId(kakao.maps.MapTypeId.TERRAIN);
        else mapInstance.removeOverlayMapTypeId(kakao.maps.MapTypeId.TERRAIN);
      });
    }

    // v2.101: "현재위치" 버튼 - 브라우저 위치 정보로 지도를 그 위치로 이동하고 마커 표시
    function wireLocateButton() {
      let locateMarker = null;
      document.getElementById("btnLocate").addEventListener("click", () => {
        if (!navigator.geolocation) { alert("이 브라우저에서는 현재 위치를 지원하지 않습니다."); return; }
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const loc = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
            mapInstance.setCenter(loc);
            mapInstance.setLevel(4);
            if (locateMarker) locateMarker.setMap(null);
            locateMarker = new kakao.maps.Marker({ position: loc, map: mapInstance });
          },
          () => alert("현재 위치를 가져오지 못했습니다. 위치 권한을 허용해주세요."),
        );
      });
    }

    // v2.105: "로드뷰(선택)" - 켜면 도로 위에 파란선(로드뷰 지원 구간)이 표시되고,
    // 그 선을 클릭하면 화면이 왼쪽(지도)/오른쪽(로드뷰) 절반씩 나뉘어 크게 보인다.
    // 로드뷰 사진 안에서 이동/회전하면(position_changed) 지도 위 빨간 점이 같이
    // 움직이고, 반대로 지도의 파란선을 다시 클릭하면 로드뷰 사진이 그 위치로 바뀐다.
    function wireRoadview() {
      const btn = document.getElementById("btnRoadview");
      const split = document.getElementById("roadviewSplit");
      const inner = document.getElementById("roadviewInner");
      const closeBtn = document.getElementById("roadviewClose");
      const roadviewClient = new kakao.maps.RoadviewClient();
      const roadviewMarkerImage = new kakao.maps.MarkerImage(
        "data:image/svg+xml;charset=UTF-8," +
          encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"><circle cx="11" cy="11" r="8" fill="#f04452" stroke="#fff" stroke-width="3"/></svg>'),
        new kakao.maps.Size(22, 22),
      );
      let roadview = null;
      let roadviewMarker = null;
      let selecting = false;

      function relayoutMap() {
        kakao.maps.event.trigger(mapInstance, "resize");
      }
      function stopSelecting() {
        selecting = false;
        btn.classList.remove("active");
        document.getElementById("map").style.cursor = "";
        mapInstance.removeOverlayMapTypeId(kakao.maps.MapTypeId.ROADVIEW);
      }
      function closeRoadview() {
        split.style.display = "none";
        if (roadviewMarker) { roadviewMarker.setMap(null); roadviewMarker = null; }
        roadview = null;
        relayoutMap();
        stopSelecting();
      }

      btn.addEventListener("click", () => {
        if (selecting) { stopSelecting(); return; }
        selecting = true;
        btn.classList.add("active");
        document.getElementById("map").style.cursor = "crosshair";
        mapInstance.addOverlayMapTypeId(kakao.maps.MapTypeId.ROADVIEW);
      });
      closeBtn.addEventListener("click", closeRoadview);

      function showRoadviewAt(pos, panoId) {
        split.style.display = "flex";
        relayoutMap();
        if (!roadview) {
          roadview = new kakao.maps.Roadview(inner);
          kakao.maps.event.addListener(roadview, "position_changed", () => {
            const p = roadview.getPosition();
            if (!roadviewMarker) {
              roadviewMarker = new kakao.maps.Marker({ position: p, map: mapInstance, image: roadviewMarkerImage });
            } else {
              roadviewMarker.setPosition(p);
            }
            mapInstance.panTo(p);
          });
        }
        roadview.setPanoId(panoId, pos);
      }

      kakao.maps.event.addListener(mapInstance, "click", (mouseEvent) => {
        if (!selecting) return;
        const pos = mouseEvent.latLng;
        // v2.102: 탐색 반경 50m가 너무 좁아 거의 항상 "지원하지 않음"으로 실패하던
        // 문제 - 300m로 넓혀서 도로에서 조금 벗어나 클릭해도 찾도록 함.
        roadviewClient.getNearestPanoId(pos, 300, (panoId) => {
          if (!panoId) { alert("이 위치는 로드뷰를 지원하지 않습니다."); return; }
          showRoadviewAt(pos, panoId);
        });
      });

      new ResizeObserver(() => { if (roadview) roadview.relayout(); }).observe(split);
    }

    async function main() {
      try {
        await loadKakaoSdk();
      } catch (e) {
        setStatus("카카오맵 SDK를 불러오지 못했습니다. 키 또는 카카오 콘솔의 Web 플랫폼(도메인) 등록을 확인해주세요.", true);
        return;
      }
      kakao.maps.load(async () => {
        mapInstance = new kakao.maps.Map(document.getElementById("map"), {
          center: new kakao.maps.LatLng(36.3504, 127.3845), // 매물이 없을 때 기본 중심(대전)
          level: 8,
        });
        // v2.101: 기본값을 지적편집도(지번지도)로 고정해서 켜둠(체크박스도 기본 체크)
        mapInstance.addOverlayMapTypeId(kakao.maps.MapTypeId.USE_DISTRICT);
        wireLayerControl();
        wireLocateButton();
        wireRoadview();

        if (!EXT_ID) {
          setStatus("이 페이지는 매물on 확장 프로그램의 '지도보기' 버튼으로 열어야 동작합니다.", true);
          return;
        }
        const response = await sendToExtension({ type: "maemulon-ready" });
        if (response && Array.isArray(response.list)) renderListings(response.list);
        else setStatus("확장 프로그램에서 매물 데이터를 받아오지 못했습니다.", true);
      });
    }

    main();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>매물on 지도</title>
<style>
  :root {
    --toss-blue: #3182f6;
    --toss-blue-dark: #1b64da;
    --toss-blue-bg: #eef4ff;
    --toss-text: #191f28;
    --toss-text-sub: #4e5968;
    --toss-text-mute: #8b95a1;
    --toss-bg: #f9fafb;
    --toss-line: #e5e8eb;
    --toss-line-strong: #d1d6db;
    /* v2.217: [버그 수정] 카드 테두리를 이 변수로 진하게 하려 했는데, 이 파일에는
       원래 이 변수가 없어서(popup.css에만 있었음) 값이 통째로 무효화돼 테두리가
       아예 안 그려지는 상태였음(border-width가 0으로 계산됨) - popup.css와 동일한
       값으로 새로 추가. */
    --toss-line-stronger: #aeb9ca;
    --toss-red: #f04452;
    --toss-red-bg: #fff0f1;
  }
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  /* v2.143: [요청 반영] body를 세로 flex 컬럼으로 바꿔서 상단바들(topbar/filterbar/
     toolbar)은 내용만큼만 차지하고 지도(#mapWrap)가 나머지 공간을 전부 채우게 함 -
     예전처럼 height:calc(100% - 37px) 같은 하드코딩된 픽셀 계산에 기대지 않아도 됨. */
  body { display: flex; flex-direction: column; }
  #topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    background: #fff;
    border-bottom: 1px solid var(--toss-line);
    font-size: 13px;
    color: var(--toss-text-sub);
  }
  #topbar strong { color: var(--toss-text); }
  /* v2.115: 지금 보고 있는 페이지가 최신 파일인지 눈으로 바로 확인할 수 있도록
     버전 배지를 눈에 띄게 표시(GitHub Pages/브라우저 캐시로 옛날 파일이 계속
     보이는 문제를 사용자가 직접 구분할 수 있게 하기 위함). */
  #buildTag {
    background: #f04452;
    color: #fff;
    font-weight: 700;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
  }
  #status.error { color: #f04452; }

  /* v2.143: [기능 추가] 목록창(popup.html)의 필터바(지역/거래유형·매물종류/검색/
     초기화/㎡)와 목록·지도 전환 버튼을 지도창에도 동일하게 구현. 이 페이지는 외부
     호스팅(GitHub Pages)이라 popup.css를 불러올 수 없어서, 필요한 클래스만 이 페이지
     스타일에 맞게 복제(popup.css v2.142 기준 - 진한 테두리/파란 배경/32px 높이 통일). */
  #mapFilterbar {
    flex: none;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 8px 14px;
    background: #fff;
    border-bottom: 1px solid var(--toss-line);
  }
  .filter-dropdowns { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-dropdown-btn {
    border: 1.5px solid var(--toss-text-sub);
    background: var(--toss-blue-bg);
    color: var(--toss-text);
    padding: 0 12px;
    height: 32px;
    display: inline-flex;
    align-items: center;
    border-radius: 9px;
    font-size: 13.3px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .filter-dropdown-btn:hover { border-color: var(--toss-blue); }
  .filter-dropdown-btn .dd-caret { color: var(--toss-text-mute); margin-left: 2px; }
  .filter-dropdown-btn.filter-dropdown-selected { background: #191f28; border-color: #191f28; color: #fff; }
  .filter-dropdown-btn.filter-dropdown-selected .dd-caret { color: #fff; }
  .search-group { display: flex; align-items: center; gap: 4px; }
  .search-group input[type="text"] {
    width: 200px;
    border: 1px solid var(--toss-red);
    background: var(--toss-red-bg);
    border-radius: 9px;
    padding: 0 10px;
    height: 32px;
    font-size: 13.3px;
    color: var(--toss-text);
    font-family: inherit;
  }
  .search-group input[type="text"]:focus { outline: none; border-color: var(--toss-red); background: #fff; }
  .search-group button {
    border: none;
    background: var(--toss-blue);
    color: #fff;
    padding: 0 12px;
    height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 9px;
    font-size: 13.3px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .search-group button:hover { background: var(--toss-blue-dark); }
  .search-group .btn-reset,
  .search-group .btn-area-unit {
    background: var(--toss-line);
    color: var(--toss-text-sub);
    border: 1.5px solid var(--toss-text-sub);
  }
  .search-group .btn-reset:hover,
  .search-group .btn-area-unit:hover { background: var(--toss-line-strong); }

  /* v2.143: [기능 추가] 정렬(자리만)/목록/지도 3버튼 - 목록창과 지도창에 동일하게 배치 */
  .view-switch { display: flex; align-items: center; gap: 4px; margin-left: auto; }
  .view-switch-btn {
    border: 1px solid var(--toss-line-strong);
    background: #fff;
    color: var(--toss-text-sub);
    padding: 0 12px;
    height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 9px;
    font-size: 13.3px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
  }
  .view-switch-btn:hover:not(:disabled) { border-color: var(--toss-blue); }
  .view-switch-btn:disabled { cursor: default; }
  .view-switch-btn.view-switch-active { background: #191f28; border-color: #191f28; color: #fff; }

  /* v2.132/v2.142 popup.css 이식: ①지역/②③거래유형·매물종류 팝업 */
  .filter-popup {
    position: fixed;
    z-index: 2000;
    width: 460px;
    background: #fff;
    border: 1px solid var(--toss-line-strong);
    border-radius: 14px;
    box-shadow: 0 12px 28px rgba(25, 31, 40, 0.2);
    padding: 12px;
    font-size: 13px;
    color: var(--toss-text);
  }
  .filter-popup-breadcrumb {
    font-size: 12.5px;
    color: var(--toss-text-sub);
    font-weight: 600;
    margin-bottom: 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .filter-popup-breadcrumb .crumb-link { color: var(--toss-blue); cursor: pointer; }
  .filter-popup-breadcrumb .crumb-link:hover { text-decoration: underline; }
  .filter-popup-search {
    width: 100%;
    box-sizing: border-box;
    padding: 7px 10px;
    margin-bottom: 8px;
    border: 1px solid var(--toss-line-strong);
    border-radius: 8px;
    font-size: 13.3px;
    background: var(--toss-bg);
    font-family: inherit;
  }
  .filter-popup-search:focus { outline: none; border-color: var(--toss-blue); background: #fff; }
  .filter-popup-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-auto-rows: min-content;
    align-content: start;
    gap: 6px;
    max-height: 360px;
    overflow-y: auto;
  }
  .filter-popup-grid button {
    border: 1px solid var(--toss-line-strong);
    background: var(--toss-bg);
    color: var(--toss-text);
    min-width: 0;
    padding: 8px 6px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: inherit;
  }
  .filter-popup-grid button:hover { border-color: var(--toss-blue); }
  .filter-popup-grid button.selected { background: #191f28; border-color: #191f28; color: #fff; }
  .filter-popup-grid button.hidden-by-search { display: none; }
  .filter-popup-footer { display: flex; justify-content: flex-end; gap: 6px; margin-top: 10px; }
  .filter-popup-footer button {
    border: none;
    background: var(--toss-line);
    color: var(--toss-text-sub);
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .filter-popup-footer button:hover { background: var(--toss-line-strong); }
  .filter-popup-footer button.primary { background: var(--toss-blue); color: #fff; }
  .filter-popup-footer button.primary:hover { background: var(--toss-blue-dark); }
  .filter-popup-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .filter-popup-header button {
    border: none;
    background: transparent;
    color: var(--toss-text-sub);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 6px;
    font-family: inherit;
  }
  .filter-popup-header button:hover { background: var(--toss-line); }
  .filter-popup-section-title { font-size: 12.5px; font-weight: 700; color: var(--toss-text); margin: 8px 0 6px; }
  .filter-chip-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .filter-chip-grid + .filter-chip-grid { margin-top: 14px; }
  .filter-chip-grid button {
    border: 1px solid var(--toss-line-strong);
    background: var(--toss-bg);
    color: var(--toss-text-sub);
    min-width: 0;
    padding: 8px 6px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: inherit;
  }
  .filter-chip-grid button:hover { border-color: var(--toss-blue); }
  .filter-chip-grid button.selected { background: var(--toss-text); border-color: var(--toss-text); color: #fff; }

  /* v2.105: 로드뷰를 떠 있는 작은 팝업 대신, 지도 옆에 화면을 절반씩 나눠 크게
     보여주는 방식으로 변경(밸류맵 등 참고 사이트 방식). */
  #mapWrap { flex: 1; min-height: 0; display: flex; width: 100%; }
  #map { flex: 1; min-width: 0; background: var(--toss-bg); }
  /* v2.144: ③ 매물목록 패널 자리(placeholder)였던 자리.
     v2.154: [기능 추가] 실제 매물 카드 목록으로 교체(okbds.kr 참고 디자인 기반) - 폭은
     여전히 확정값 아님(지금은 320px). */
  /* v2.176: [요청 반영] 목록 카드를 3줄->4줄로 재설계하면서 카드 자체가 커져서
     패널 폭도 같이 넓힘(320px -> 420px, 지도 표시 영역은 그만큼 좁아지는 트레이드오프
     있음 - 사용자 확인 후 진행). */
  #listPanel {
    flex: none;
    width: 420px;
    background: var(--toss-bg);
    overflow-y: auto;
    /* v2.217: [요청 반영] 카드와 지도/창 가장자리 사이 여백을 완전히 제거
       v2.219: [버그 수정] 이 자체 border-left(1px)가 카드 왼쪽 테두리(2px)와 나란히
       겹쳐서 지도-목록 경계선이 두 줄로 보이던 원인 - 카드 자체 왼쪽 테두리 하나로
       충분하므로 이 border는 제거. */
    padding: 0;
  }
  #listPanel .list-empty {
    text-align: center;
    color: var(--toss-text-mute);
    font-size: 13px;
    line-height: 1.6;
    padding: 24px 10px;
  }
  /* v2.217: [요청 반영] 테두리 색이 너무 옅어서(var(--toss-line), #f2f4f6) 잘 안 보인다는
     피드백 - 더 뚜렷한 회색(var(--toss-line-stronger), #aeb9ca)으로 교체.
     v2.218: [요청 반영] 사용자 지정 색상(#8997A7)으로 재변경 + 두께 1px->2px(2배). */
  .list-card {
    display: flex;
    gap: 10px;
    background: #fff;
    border: 2px solid #8997A7;
    padding: 10px;
    cursor: pointer;
  }
  .list-card:hover { border-color: var(--toss-blue); }
  /* v2.219: [버그 수정] 카드가 서로 맞닿게 되면서, 위 카드의 아래쪽 테두리 + 아래
     카드의 위쪽 테두리가 겹쳐 두 줄(두 배 두께)로 보이던 문제 - 마지막 카드를 뺀
     나머지는 아래쪽 테두리를 없애서, 경계선이 항상 "아래 카드의 위쪽 테두리" 한 줄로만
     그려지게 함.
     v2.220: [버그 수정] 이 규칙이 선택된(강조) 카드에도 그대로 적용되면서, 선택된
     카드가 목록 맨 마지막이 아닐 때는 자기 아래쪽 테두리가 사라지고 그 대신 바로 아래
     (선택 안 된, 평범한 회색) 카드의 위쪽 테두리로 경계선이 그려져버려 "선택 박스의
     아랫변이 없어 보이는" 버그가 있었음 - 선택된 카드(.list-card-focus)는 이 규칙에서
     제외해서, 위치와 상관없이 항상 자기 테두리 4면을 온전히 유지하도록 함(선택 카드
     바로 아래에 카드가 더 있으면 그 경계에 얇은 회색 줄이 살짝 겹쳐 보일 수 있지만,
     선택 박스가 항상 완전하게 보이는 것을 우선). */
  .list-card:not(:last-child):not(.list-card-focus) { border-bottom: none; }
  /* v2.216: [요청 반영] 카드 사이 여백/둥근 모서리를 없애서 서로 붙는 사각형
     박스로(매물목록 팝업 표의 거래유형별 배경색과 동일한 색을 카드 배경에도 적용). */
  .list-card.list-card-maemae { background: #fff8f1; }
  .list-card.list-card-jeonse { background: #f2faf6; }
  .list-card.list-card-wolse { background: #f3effb; }
  /* v2.176: [요청 반영] 사용자가 첨부한 샘플(OK부동산)의 썸네일은 세로로 너무 길어
     비율이 어색했음("엇박자") - 기존 카드의 가로:세로 비율(84:64 ≈ 1.31:1)은 그대로
     유지한 채 크기만 키움(108x82, 같은 비율). 실제 사진은 여전히 못 띄운다(v2.138의
     64MiB 메시지 크기 제한 때문에 이 페이지로는 첨부파일이 아예 안 넘어옴) - 매물종류
     첫 글자 자리표시자는 그대로 유지. */
  .list-card-thumb {
    position: relative;
    flex: none;
    width: 108px;
    height: 82px;
    border-radius: 7px;
    background: var(--toss-line);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--toss-text-mute);
    font-size: 24px;
    overflow: hidden;
  }
  .list-card-ribbon {
    position: absolute;
    top: 3px;
    left: 3px;
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 4px;
  }
  /* v2.154: [기능 추가] ♡(관심매물 표시/토글) - 클릭하면 적색 ♥로 바뀜. 카드 클릭(지도
     이동)과 겹치지 않도록 클릭 시 이벤트 전파를 막아서 별도로 처리(JS 참고). */
  .list-card-heart {
    position: absolute;
    bottom: 2px;
    right: 3px;
    font-size: 17px;
    color: #fff;
    text-shadow: 0 0 2px rgba(0,0,0,0.6);
    cursor: pointer;
    line-height: 1;
  }
  .list-card-heart.active { color: #f04452; }
  .list-card-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; justify-content: center; }
  /* v2.176: [기능 추가] 목록창(popup.js)의 풍선(title)/메모장 수정 기능을 지도창에도
     동일하게 반영(요청 반영) - 4줄 중 "매물소개"(단일 필드)만 popup.js의 다른
     단일필드 칸들처럼 미니 메모장으로 즉석 수정 가능(nls-mini-editable 클래스로
     표시, hover 시 옅은 배경으로 힌트). 나머지 3줄(매물코드+주소/제목+종류+면적/
     거래유형+가격)은 여러 필드가 합쳐진 줄이라 popup.js의 "면적요약(area-open)"
     칸과 동일한 관례를 따라 클릭 시 전체 수정창을 연다(nls-edit-open 클래스). */
  .nls-mini-editable:hover { background: var(--toss-blue-bg); border-radius: 5px; }
  .nls-edit-open:hover { background: var(--toss-line); border-radius: 5px; }
  /* 1번째 줄: 매물코드 + 주소(지번 제외) - 옅은 녹색 바탕의 라벨 형태 */
  /* v2.216: [요청 반영] 글자 크기 전부 +1px
     v2.219: [요청 반영] 여전히 작다는 피드백 - 배지(버튼) 글자만 빼고 전부 +1px 추가
     v2.220: [요청 반영] 옅은 회색(var(--toss-text-mute))이 잘 안 보인다는 피드백 -
     청회색(#191F28)으로 변경(매매/전세/월세 배지·거래금액은 이번에도 제외, 그대로 유지) */
  .list-card-row1 {
    display: inline-block;
    align-self: flex-start;
    background: #e2eee5;
    color: #191F28;
    font-size: 12.5px;
    padding: 2px 7px;
    border-radius: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  /* 2번째 줄: 제목 + 물건종류 + 면적 - 진한 청색 강조(요청 반영)
     v2.220: [요청 반영] "제목" 글자색을 파랑(#3182F6)으로 변경 */
  .list-card-row2 {
    font-size: 15px;
    font-weight: 700;
    color: #3182F6;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* 3번째 줄: 매물소개 */
  .list-card-row3 {
    font-size: 13px;
    color: #191F28;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* 4번째 줄: 매물종류 + 거래유형 + 가격 */
  .list-card-row4 { font-size: 14.5px; margin-top: 1px; }
  .list-card-type {
    color: #191F28;
    font-size: 13px;
    margin-right: 4px;
  }
  /* v2.217: [요청 반영] 배지(버튼) 배경색을 거래유형별로 다르게 - 기본값(고정 빨강)은
     거래유형 클래스가 없는 예외 케이스만 남음.
     v2.218: [요청 반영] 사용자 지정 색상으로 교체(매매=#C40000/전세=#533BFF/월세=#9070E4). */
  .list-card-deal {
    display: inline-block;
    background: var(--toss-red);
    color: #fff;
    font-size: 11.5px;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 4px;
    margin-right: 4px;
  }
  .list-card-maemae .list-card-deal { background: #C40000; }
  .list-card-jeonse .list-card-deal { background: #533BFF; }
  .list-card-wolse .list-card-deal { background: #9070E4; }
  /* v2.216: [요청 반영] 거래금액 글자색 지정
     v2.217: [요청 반영] 고정 #C00000 하나가 아니라, 배지와 동일하게 거래유형별로 다르게
     v2.218: [요청 반영] 사용자 지정 색상으로 교체(배지와 동일한 값 재사용) - 기본값은
     매매(가장 흔한 케이스)와 거래유형 미상 케이스에 대한 안전값으로 유지. */
  .list-card-price-num { font-weight: 700; color: #C40000; }
  .list-card-jeonse .list-card-price-num { color: #533BFF; }
  .list-card-wolse .list-card-price-num { color: #9070E4; }
  /* v2.176: [기능 추가] 매물목록창에서 특정 매물을 지도로 이동했을 때(FOCUS_ID),
     목록 패널의 해당 카드도 같이 강조(요청 반영) - 마커의 빨간 펄스(#mm-focus-marker)
     와 색을 맞춰 진한 빨간 테두리로 표시.
     v2.216: [요청 반영] 이중 박스처럼 보이던 옅은 빨간 배경(#fff0f0) 오버라이드는
     제거(카드 배경은 이제 거래유형색을 그대로 유지) - 테두리만 두껍게.
     v2.217: [요청 반영] 선택 테두리 두께 2px 기준 2배(4px)로 상향, 색상도 배지/거래
     금액과 동일한 체계로 통일(지난 라운드의 아이보리/연두/보라 계열은 폐기).
     v2.218: [요청 반영] 배지/거래금액 색상이 사용자 지정값으로 바뀌면서 선택 테두리도
     동일하게 재사용(매매=#C40000/전세=#533BFF/월세=#9070E4).
     v2.219: [요청 반영] 두께 4px가 너무 두껍다는 피드백 - 3px로 축소. */
  .list-card.list-card-focus { border-width: 3px; border-color: #C40000; }
  .list-card.list-card-maemae.list-card-focus { border-color: #C40000; }
  .list-card.list-card-jeonse.list-card-focus { border-color: #533BFF; }
  .list-card.list-card-wolse.list-card-focus { border-color: #9070E4; }
  /* v2.176: [기능 추가] "매물소개" 줄 클릭 시 뜨는 즉석 미니 메모장 - popup.js/
     popup.css의 #inlineEditor와 동일한 형태(별도 문서라 스타일만 복제). */
  #miniEditor {
    position: fixed;
    z-index: 3000;
    width: 260px;
    background: #fff;
    border: 1px solid var(--toss-line-strong, #d1d6db);
    border-radius: 12px;
    box-shadow: 0 12px 28px rgba(25, 31, 40, 0.2);
    padding: 10px;
    display: none;
  }
  #miniEditor textarea {
    width: 100%;
    min-height: 80px;
    font-size: 13px;
    padding: 8px 10px;
    border: 1px solid var(--toss-line-strong, #d1d6db);
    border-radius: 8px;
    font-family: inherit;
    background: var(--toss-bg);
    color: var(--toss-text);
    resize: vertical;
    box-sizing: border-box;
  }
  #miniEditor textarea:focus { outline: none; border-color: var(--toss-blue); background: #fff; }
  #miniEditorActions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 8px; }
  #miniEditorActions button {
    border: none;
    background: var(--toss-line);
    color: var(--toss-text-sub);
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
  }
  #miniEditorActions button.primary { background: var(--toss-blue); color: #fff; }
  #roadviewSplit {
    display: none;
    flex: 1;
    min-width: 0;
    flex-direction: column;
    border-left: 1px solid var(--toss-line);
  }
  #roadviewSplitBar {
    flex: none;
    height: 32px;
    background: rgba(0, 0, 0, 0.75);
    color: #fff;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px;
  }
  #roadviewClose { border: none; background: transparent; color: #fff; cursor: pointer; font-size: 14px; line-height: 1; padding: 2px 4px; }
  #roadviewInner { flex: 1; min-height: 0; }
  /* v2.154: .info-window 규칙 삭제 - 마커 클릭이 정보창 대신 수정창을 바로 열게
     바뀌면서(아래 스크립트 참고) 더는 안 쓰임. */
  /* v2.143: 아이콘 13개를 지도 우측 상단 세로 고정 배치(position:fixed)에서 필터바
     아래 가로 1줄로 옮겼었는데, 지도 폭 자체는 안 줄어들고 화면 위아래만 좁아지는
     효과라 요청과 달랐음.
     v2.144: [요청 반영] #mapWrap의 정상적인 flex 자식(세로 1열)으로 다시 배치 -
     이번엔 실제로 지도 폭이 그만큼 줄어들고("지도 좌우 축소"), position:fixed가
     아니므로 로드뷰 닫기 버튼과 겹칠 걱정도 여전히 없음. 아이콘 10개 전체 폭이
     대략 55px(버튼 36px + 그룹 테두리/패딩)이 되도록 폭을 지정. */
  #mapToolbar {
    flex: none;
    width: 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 8px 4px;
    background: #fff;
    border-left: 1px solid var(--toss-line);
    overflow-y: auto;
  }
  .toolbar-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    background: #fff;
    border: 1px solid var(--toss-line);
    border-radius: 12px;
    padding: 6px;
    box-shadow: 0 1px 6px rgba(25, 31, 40, 0.15);
  }
  /* v2.114: 위성도/지적도/지형도 체크박스를 툴바 안으로 편입.
     v2.144: [요청 반영] 세로 1열로 되돌아온 툴바 안에서, 가로로 넓게 벌어져 있던
     체크박스 3개를 약 70×70px의 정사각형에 가까운 작은 블록으로 압축(글자 크기도
     같이 줄여서 3줄이 그 폭 안에 들어가게 함). */
  /* v2.145: [요청 반영] 체크박스 3개 글자/박스 크기 +1pt(10.3px->11.6px, 11px->12.3px)
     + 가운데 정렬(라벨 자체를 justify-content:center로 중앙 정렬). */
  .toolbar-group.checkbox-group {
    width: 70px;
    align-items: center;
    padding: 6px 5px;
    font-size: 11.6px;
    color: var(--toss-text);
    gap: 4px;
  }
  .toolbar-group.checkbox-group label { display: flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer; white-space: nowrap; }
  .toolbar-group.checkbox-group input { margin: 0; width: 12.3px; height: 12.3px; }
  /* v2.141: [요청 반영] 버튼 10개(현재위치~처음으로)는 작을수록 좋다는 요청에 따라
     v2.140의 44px(일부는 50% 확대해 60px)에서 36px/아이콘 22px로 축소(.toolbar-btn-lg
     확대 규칙은 제거) */
  .toolbar-btn {
    width: 36px;
    height: 36px;
    border: none;
    background: transparent;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }
  .toolbar-btn:hover { background: var(--toss-bg); }
  .toolbar-btn img { width: 22px; height: 22px; display: block; pointer-events: none; }
  .toolbar-btn.active { background: var(--toss-blue); }
  .toolbar-btn.active img { filter: brightness(0) invert(1); }
  .toolbar-btn-text { font-size: 10.5px; color: var(--toss-text); font-family: inherit; font-weight: 600; border: 1px solid var(--toss-line) !important; }
  .toolbar-btn-text.active { color: #fff; border-color: var(--toss-blue) !important; }
  .measure-label {
    background: #191f28;
    color: #fff;
    font-size: 13px;
    padding: 5px 8px;
    border-radius: 6px;
    white-space: nowrap;
    box-shadow: 0 1px 4px rgba(25, 31, 40, 0.2);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .measure-label .measure-close {
    border: none;
    background: rgba(255, 255, 255, 0.25);
    color: #fff;
    width: 22px;
    height: 22px;
    line-height: 22px;
    border-radius: 50%;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    padding: 0;
    flex: none;
  }
  .segment-label {
    background: rgba(25, 31, 40, 0.8);
    color: #fff;
    font-size: 10.5px;
    padding: 1px 5px;
    border-radius: 4px;
    white-space: nowrap;
  }
  /* v2.163: [기능 추가] 목록창 "매물on 지도" 아이콘으로 특정 매물 위치를 찍었을 때,
     기존 파란 물방울 마커와 구분되는 빨간 펄스 마커 - 클릭하면 수정창이 열린다.
     v2.171: [요청 반영] 크기를 40% 축소(22px -> 13px, 테두리 3px -> 2px). */
  .mm-focus-marker {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #ff3b30;
    border: 2px solid #ffffff;
    box-shadow: 0 0 0 rgba(255, 59, 48, 0.6);
    animation: mm-focus-pulse 1.4s infinite;
    cursor: pointer;
  }
  @keyframes mm-focus-pulse {
    0% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.6); }
    70% { box-shadow: 0 0 0 10px rgba(255, 59, 48, 0); }
    100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
  }
</style>
</head>
<body>
  <div id="topbar">
    <strong>매물on 지도</strong>
    <span id="buildTag">v2.176</span>
    <span id="status">확장 프로그램에서 매물 데이터를 기다리는 중...</span>
  </div>
  <!-- v2.143: [기능 추가] 목록창(popup.html)의 필터바(지역/거래유형·매물종류/검색/
       초기화/㎡)와 목록·지도 전환 버튼(정렬은 자리만)을 지도창에도 동일하게 구현.
       필터는 이미 이 페이지가 로드 시점에 한 번에 받아온 전체 매물 배열(allListings)을
       클라이언트에서 걸러 마커만 다시 그리는 방식이라, 목록창처럼 storage를 다시 읽지
       않아도 됨. -->
  <div id="mapFilterbar">
    <div class="filter-dropdowns">
      <button type="button" id="btnRegionFilter" class="filter-dropdown-btn" title="지역 선택">지역 전체 <span class="dd-caret">▾</span></button>
      <button type="button" id="btnDealTypeFilter" class="filter-dropdown-btn" title="거래유형·매물종류 선택">거래유형·매물종류 전체 <span class="dd-caret">▾</span></button>
    </div>
    <div class="search-group">
      <input type="text" id="searchInput" placeholder="검색어를 입력하세요" />
      <button type="button" id="btnSearch">검색</button>
      <button type="button" id="btnSearchReset" class="btn-reset" title="검색조건 초기화">초기화</button>
      <button type="button" id="btnAreaUnit" class="btn-area-unit" title="면적 단위 표시 전환(㎡ ↔ 평)">⟳ ㎡</button>
    </div>
    <div class="view-switch">
      <button type="button" id="btnSortView" class="view-switch-btn" title="정렬(준비 중)" disabled>⇅</button>
      <button type="button" id="btnGoList" class="view-switch-btn" title="매물목록 열기">목록</button>
      <button type="button" id="btnGoMap" class="view-switch-btn view-switch-active" title="현재 화면" disabled>지도</button>
    </div>
  </div>
  <!-- v2.132/v2.142 popup.html 이식: ①지역 선택 팝업 -->
  <div id="regionFilterPopup" class="filter-popup" style="display:none">
    <div class="filter-popup-breadcrumb" id="regionBreadcrumb"></div>
    <input type="text" id="regionSearchInput" class="filter-popup-search" placeholder="입력해서 찾기" style="display:none" />
    <div class="filter-popup-grid" id="regionGrid"></div>
    <div class="filter-popup-footer">
      <button type="button" id="regionApplyBtn" class="primary">적용</button>
      <button type="button" id="regionResetBtn">초기화</button>
      <button type="button" id="regionCancelBtn">취소</button>
    </div>
  </div>
  <!-- v2.132/v2.142 popup.html 이식: ②③거래유형·매물종류 통합 팝업 -->
  <div id="dealTypeFilterPopup" class="filter-popup" style="display:none">
    <div class="filter-popup-header">
      <button type="button" id="dealTypeResetBtn" title="이 팝업의 선택 초기화">↻ 초기화</button>
      <button type="button" id="dealTypeCloseBtn" title="닫기">✕</button>
    </div>
    <div class="filter-popup-section-title">거래유형</div>
    <div class="filter-chip-grid" id="dealTypeChips"></div>
    <div class="filter-popup-section-title">매물종류</div>
    <div id="propertyTypeChips"></div>
  </div>
  <div id="mapWrap">
    <div id="map"></div>
    <div id="roadviewSplit">
      <div id="roadviewSplitBar">
        로드뷰 (지도 위 파란선을 클릭하면 여기가 바뀌고, 사진 안에서 이동하면 지도의 빨간 점도 같이 움직입니다)
        <button type="button" id="roadviewClose">✕</button>
      </div>
      <div id="roadviewInner"></div>
    </div>
    <!-- v2.114: 13개 버튼(현재위치~처음으로) 순서 확정.
         v2.140/v2.141: 순서 재배치 + 버튼 축소 + 체크박스 정렬(당시엔 position:fixed로
         지도 위에 떠서 우측 세로 1열).
         v2.143: 지도 노출 영역을 넓히기 위해 가로 1줄(필터바 아래)로 옮겼었음.
         v2.144: [요청 반영] 다시 세로 1열로 되돌리되, 이번엔 #mapWrap의 실제 flex
         자식(정상적인 레이아웃 한 칸)으로 배치해서 지도 폭이 실제로 줄어들게 함
         (v2.140/141은 position:fixed라 지도 위에 떠 있기만 하고 지도 폭 자체는 안
         줄었었음) - 우측에 새로 추가한 ③ 매물목록 자리(placeholder)와 나란히 배치. -->
    <div id="mapToolbar">
      <div class="toolbar-group">
        <button type="button" id="btnLocate" class="toolbar-btn" title="현재위치"><img id="iconLocate" alt="현재위치" /></button>
        <button type="button" id="btnRoadview" class="toolbar-btn toolbar-btn-text" title="로드뷰(선택)">로드뷰</button>
      </div>
      <div class="toolbar-group">
        <button type="button" id="btnZoomIn" class="toolbar-btn" title="확대"><img id="iconZoomIn" alt="확대" /></button>
        <button type="button" id="btnZoomOut" class="toolbar-btn" title="축소"><img id="iconZoomOut" alt="축소" /></button>
      </div>
      <div class="toolbar-group">
        <button type="button" id="btnDistance" class="toolbar-btn" title="거리재기"><img id="iconDistance" alt="거리재기" /></button>
        <button type="button" id="btnArea" class="toolbar-btn" title="면적재기"><img id="iconArea" alt="면적재기" /></button>
        <button type="button" id="btnRadius" class="toolbar-btn" title="반경재기"><img id="iconRadius" alt="반경재기" /></button>
      </div>
      <div class="toolbar-group">
        <button type="button" id="btnCalculator" class="toolbar-btn" title="계산기"><img id="iconCalculator" alt="계산기" /></button>
        <button type="button" id="btnRealPrice" class="toolbar-btn" title="실거래가"><img id="iconRealPrice" alt="실거래가" /></button>
      </div>
      <div class="toolbar-group">
        <button type="button" id="btnHome" class="toolbar-btn toolbar-btn-text" title="처음으로">처음으로</button>
      </div>
      <div class="toolbar-group checkbox-group">
        <label><input type="checkbox" id="chkSkyview" /> 위성도</label>
        <label><input type="checkbox" id="chkDistrict" checked /> 지적도</label>
        <label><input type="checkbox" id="chkTerrain" /> 지형도</label>
      </div>
    </div>
    <!-- v2.144: ③ 매물목록 패널 자리(placeholder)였던 자리.
         v2.154: [기능 추가] 실제 매물 카드 목록(js에서 채움). -->
    <div id="listPanel"></div>
    <!-- v2.176: [기능 추가] "매물소개" 즉석 미니 메모장(popup.js의 #inlineEditor와 동일 패턴) -->
    <div id="miniEditor">
      <textarea id="miniEditorInput"></textarea>
      <div id="miniEditorActions">
        <button type="button" id="miniEditorCancel">취소</button>
        <button type="button" id="miniEditorSave" class="primary">저장</button>
      </div>
    </div>
  </div>
  <!-- v2.143: [기능 추가] ①지역선택 필터에 필요한 전국 법정동 DB. popup.html이 쓰는
       것과 같은 파일이며, 이 파일도 kakao-map.html과 함께 GitHub Pages 저장소
       (hic71991-0928/maemulon-map)에 같이 업로드해야 함(한 번만 하면 되고, region-db.js

    let lastSendError = "";

      return new Promise((resolve) => {

          lastSendError = "확장 프로그램 ID 없음 또는 chrome.runtime 사용 불가";

          resolve(response || null);
        });
      });

    async function geocodeAddress(address) {
      const res = await fetch(`https://dapi.kakao.com/v2/local/search/address.json?query=${encodeURIComponent(address)}`, {
        headers: { Authorization: `KakaoAK ${KAKAO_REST_KEY}` },
      });
      if (!res.ok) return null;
      const data = await res.json();
      const doc = data.documents && data.documents[0];
      if (!doc) return null;
      return { lat: parseFloat(doc.y), lng: parseFloat(doc.x) };
    }

      if (focusOverlay) { focusOverlay.setMap(null); focusOverlay = null; }
      if (!FOCUS_ID && !(Number.isFinite(FOCUS_LAT) && Number.isFinite(FOCUS_LNG))) return;

      // 자체는 가볍게 유지된다.

      if (sigungu) {
        const scoped = allListings.filter((r) => r["시·군·구"] === sigungu);
        await renderListings(scoped, false);
        target = currentMarkerData.find((d) => d.id === FOCUS_ID);
      }
      const lat = target ? target.pos.getLat() : FOCUS_LAT;
      const lng = target ? target.pos.getLng() : FOCUS_LNG;
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;
      const pos = new kakao.maps.LatLng(lat, lng);
      mapInstance.setCenter(pos);
      if (mapInstance.getLevel() > 3) mapInstance.setLevel(3);
      const el = document.createElement("div");
      el.className = "mm-focus-marker";
      el.title = "선택한 매물 위치 (클릭하면 수정창이 열립니다)";

        sendToExtension({ type: "maemulon-open-edit", id: FOCUS_ID || (target && target.id) });
      });
      focusOverlay = new kakao.maps.CustomOverlay({ position: pos, content: el, yAnchor: 0.5, xAnchor: 0.5, zIndex: 999 });
      focusOverlay.setMap(mapInstance);
    }

    // v2.143: [기능 추가] resetView=false면 지도의 현재 중심/확대 상태를 그대로 두고
    // 마커만 다시 그린다(필터를 바꿀 때마다 매번 압구정역으로 화면이 튀면 불편하므로).
    // resetView=true는 최초 로드 시점에만 사용(v2.110 기준 위치로 시작).
    async function renderListings(list, resetView = true) {
      setStatus(`매물 ${list.length}건 확인 중...`);
      if (currentClusterer) { currentClusterer.clear(); currentClusterer = null; }
      currentMarkers.forEach((m) => m.setMap(null));
      currentMarkers = [];
      currentMarkerData = [];
      const updatedCoords = [];
      let failCount = 0;

      for (const rec of list) {
        // v2.165: [기능 삭제] "전체주소" 필드 폐지, "지번" 하나로 통일 - 지오코딩
        // 원본 주소도 이제 "지번"에서 가져온다.
        const addr = rec["지번"];
        if (!addr) continue;
        let lat = rec.__위도;
        let lng = rec.__경도;
        if (typeof lat !== "number" || typeof lng !== "number") {
          const geo = await geocodeAddress(addr);
          if (!geo) { failCount++; continue; }
          lat = geo.lat;
          lng = geo.lng;
          updatedCoords.push({ id: rec.__매물번호, lat, lng });
        }
        const pos = new kakao.maps.LatLng(lat, lng);
        // v2.171: [요청 반영] 40% 축소한 커스텀 이미지 적용(defaultMarkerImage).
        const marker = new kakao.maps.Marker({ position: pos, image: defaultMarkerImage });
        // v2.154: [요청 반영] 마커(물방울 모양) 클릭 시 정보창 대신 곧바로 수정창을 연다
        // (예전엔 정보창을 먼저 열고 그 안의 "수정창 열기" 버튼을 한 번 더 눌러야 했음).
        kakao.maps.event.addListener(marker, "click", () => {
          sendToExtension({ type: "maemulon-open-edit", id: rec.__매물번호 });
        });
        currentMarkers.push(marker);
        currentMarkerData.push({ id: rec.__매물번호, rec, pos, marker });
      }

      if (currentMarkers.length) {
        currentClusterer = new kakao.maps.MarkerClusterer({ map: mapInstance, markers: currentMarkers, averageCenter: true, minLevel: 6 });
        // v2.110: [요청 반영] 매물 데이터 기준(평균/밀집지역)으로 첫 화면 위치를
        // 자동 계산하는 방식이 계속 엉뚱한 곳을 잡는 문제가 있어, 사용자가 지정한
        // 고정 위치(DEFAULT_MAP_CENTER)로 항상 시작하도록 단순화함.
        if (resetView) {
          mapInstance.setCenter(new kakao.maps.LatLng(DEFAULT_MAP_LAT, DEFAULT_MAP_LNG));
          mapInstance.setLevel(DEFAULT_MAP_LEVEL);
        }
        const filtered = allListings.length && list.length !== allListings.length;
        setStatus(`총 ${currentMarkers.length}건 표시됨${failCount ? ` (주소 변환 실패 ${failCount}건 제외)` : ""}${filtered ? ` (전체 ${allListings.length}건 중 필터링됨)` : ""}.`);
      } else {
        setStatus("지도에 표시할 매물이 없습니다(지번(주소)이 저장된 매물이 없거나 좌표 변환에 실패했습니다, 또는 필터 조건에 맞는 매물이 없습니다).", true);
      }

      // v2.105: 새로 변환한 좌표는 확장 프로그램에 돌려보내 chrome.storage에 캐싱하게 한다
      // (다음에 열 때는 다시 지오코딩하지 않도록).
      if (updatedCoords.length) sendToExtension({ type: "maemulon-coords-update", coords: updatedCoords });

      // v2.154: [기능 추가] ③ 매물목록 카드 - 지도에 실제로 찍힌(주소 변환 성공한) 매물만
      // 카드로도 보여준다(카드 클릭 -> 지도 이동이 항상 가능하도록).
      renderListPanel(currentMarkerData);
    }

    // ===================== v2.154: ③ 매물목록 카드 패널 =====================
    const listPanelEl = document.getElementById("listPanel");
    // v2.154: [기능 추가] ♡(관심매물) - 클릭하는 즉시 화면에 반영(낙관적 갱신)하고,
    // background.js를 거쳐 chrome.storage에도 저장한다. allListings/currentMarkerData가
    // 참조하는 rec 객체는 동일 인스턴스라, 여기서 rec.__관심매물만 바꿔주면 이후 재필터링
    // 때도(computeFilteredListings가 allListings를 훑을 때) 값이 그대로 유지된다.
    function toggleFavorite(rec) {
      rec.__관심매물 = !rec.__관심매물;
      sendToExtension({ type: "maemulon-toggle-favorite", id: rec.__매물번호, value: rec.__관심매물 });
      return rec.__관심매물;
    }
    // v2.176: [기능 추가] "매물소개" 표시용 - content.js/popup.js/edit.js에 이미 있는
    // computeIntro()와 동일 로직을 이 문서에도 복제(별도 문서라 공유 불가, 4번째 복제본 -
    // 저 세 곳을 고칠 때 여기도 같이 고쳐야 함). v2.173에서 고친 "OO역N분" 예외 처리도
    // 그대로 포함.
    const MAP_UI_BOILERPLATE_RE = /^(알림관심매물|알림|공유하기|관심매물|매물\s*보러가기|면적\s*단위\s*변경\s*평?|평|창닫기|도움말(\s*보기)?|평당가\s*도움말|보기|이미지|매물\s*대표\s*이미지\s*\d*\s*이미지|매물\d*|개|\d+|[\d,]+\s*(억\s*)?[\d,]*\s*만?\s*원?\s*\/\s*3\.3\s*(㎡|m²)(평당가\s*도움말)?)$/;
    const MAP_PRICE_LINE_RE = /^(매매|전세|월세|단기임대)\s*[\d,]/;
    const MAP_SPEC_LINE_RE = /^[가-힣/]{2,10}\d/;
    const MAP_STATION_DISTANCE_RE = /^[가-힣]{1,10}역\s*\d+\s*분/;
    function computeIntroMap(rec) {
      if (rec.__매물소개Manual) return rec["매물소개"] || "";
      const raw = rec["타이틀"] || "";
      if (!raw) return rec["매물소개"] || "";
      const confirmMatch = raw.match(/확인매물|(^|\n)등록\s+\d{4}\./);
      const text = confirmMatch ? raw.slice(0, confirmMatch.index) : raw;
      const lines = text.split("\n").map((l) => l.trim()).filter(Boolean);
      for (let i = lines.length - 1; i >= 0 && i >= lines.length - 6; i--) {
        const l = lines[i].replace(/^소유자\s*/, "").trim();
        const looksLikeStationDistance = MAP_STATION_DISTANCE_RE.test(l);
        if (!l || MAP_UI_BOILERPLATE_RE.test(l) || MAP_PRICE_LINE_RE.test(l) || (MAP_SPEC_LINE_RE.test(l) && !looksLikeStationDistance)) continue;
        if (l.length < 4) continue;
        if (l.length >= 12 || !/[:：]|㎡|\d\s*층|\d\s*억|\d\s*(만)?원|\d\s*년차/.test(l)) return l;
      }
      return rec["매물소개"] || "";
    }
    // v2.176: [기능 추가] 목록 카드를 4줄로 재설계(요청 반영, OK부동산 디자인 참고).
    // 1번째 줄(매물코드+주소)/2번째 줄(제목+종류+면적)/4번째 줄(거래유형+가격)은
    // 여러 필드가 합쳐진 줄이라 popup.js의 "면적요약(area-open)" 칸과 동일한 관례를
    // 따라 클릭 시 전체 수정창을 연다(nls-edit-open). 3번째 줄(매물소개)만 단일
    // 필드라 popup.js의 다른 단일필드 칸들처럼 즉석 미니 메모장으로 수정 가능
    // (nls-mini-editable, data-mini-field="매물소개").
    function buildListCard(item) {
      const rec = item.rec;
      const gradeList = rec["매물등급"] ? rec["매물등급"].split(",").map((s) => s.trim()).filter(Boolean) : [];
      const firstGrade = gradeList[0];
      const ribbonHtml = firstGrade
        ? `<span class="list-card-ribbon" style="background:${GRADE_COLORS[firstGrade] || "#8b95a1"}">${esc(GRADE_SHORT_LABELS[firstGrade] || firstGrade)}</span>`
        : "";
      // v2.154: [알려진 제한] 이 페이지는 확장 프로그램에서 매물 데이터를 받아올 때
      // 용량 문제(v2.138)로 "첨부파일"(사진)이 아예 빠져서 넘어오므로, 실제 사진
      // 썸네일은 보여줄 수 없다 - 매물종류 첫 글자만 넣은 자리표시자로 대신함.
      // v2.176: [요청 반영] 1번째 줄 - 매물코드 + 주소(지번의 구체적 번지는 제외,
      // 시·도/시·군·구/법정동까지만 - 첨부해주신 참고 이미지의 "서울 용산구 용문동"
      // 형식과 동일).
      const addrShort = [rec["시·도"], rec["시·군·구"], rec["법정동"]].filter(Boolean).join(" ");
      const row1Text = [rec["매물코드"] ? `<${rec["매물코드"]}>` : "", addrShort].filter(Boolean).join(" ") || "(주소 없음)";
      // 2번째 줄 - 제목 + 물건종류 + 면적
      const areaVal = rec["공급면적"] || rec["전용면적"] || rec["대지면적"];
      const row2Text = [rec["제목"], rec["매물종류"], areaVal ? `${areaVal}㎡` : ""].filter(Boolean).join(" · ") || "(제목 없음)";
      // 3번째 줄 - 매물소개
      const row3Text = computeIntroMap(rec) || "(매물소개 없음)";
      // 4번째 줄 - 매물종류 + 거래유형 + 가격
      // v2.220: [버그 수정] 월세 보증금이 항상 빈 값으로 나오던 문제 - "보증금" 항목은
      // 사용자가 수동 입력하는 별개의 "임차보증금" 필드라 대부분 비어있고, 실제
      // 네이버에서 자동으로 긁어온 월세 매물의 진짜 보증금은 "전세가" 항목에 함께
      // 저장되는 구조(content.js 주석 참고, popup.js도 동일하게 취급) - 필드를 바로잡음.
      const priceText = rec["거래유형"] === "월세"
        ? `${numFmtSimple(rec["전세가"])}/${numFmtSimple(rec["월세"])}`
        : rec["거래유형"] === "전세"
        ? numFmtSimple(rec["전세가"])
        : numFmtSimple(rec["매매가"]);
      const isFocused = FOCUS_ID && rec.__매물번호 === FOCUS_ID;
      // v2.216: [요청 반영] 매물목록 팝업 표(popup.css의 deal-row-*)와 동일하게
      // 거래유형별 카드 배경색을 적용하기 위한 클래스.
      const dealCardClass = DEAL_CARD_CLASS[rec["거래유형"]] || "";
      return `<div class="list-card${dealCardClass ? " " + dealCardClass : ""}${isFocused ? " list-card-focus" : ""}" data-id="${esc(item.id)}">
        <div class="list-card-thumb">
          ${ribbonHtml}
          <span>${esc((rec["매물종류"] || "매").slice(0, 1))}</span>
          <span class="list-card-heart${rec.__관심매물 ? " active" : ""}" data-id="${esc(item.id)}">${rec.__관심매물 ? "♥" : "♡"}</span>
        </div>
        <div class="list-card-body">
          <div class="list-card-row1 nls-edit-open" title="${esc(row1Text)}">${esc(row1Text)}</div>
          <div class="list-card-row2 nls-edit-open" title="${esc(row2Text)}">${esc(row2Text)}</div>
          <div class="list-card-row3 nls-mini-editable" data-mini-field="매물소개" title="${esc(row3Text)}">${esc(row3Text)}</div>
          <div class="list-card-row4 nls-edit-open" title="${esc([rec["매물종류"], rec["거래유형"], priceText].filter(Boolean).join(" "))}">
            <span class="list-card-type">${esc(rec["매물종류"] || "")}</span><span class="list-card-deal">${esc(rec["거래유형"] || "")}</span><span class="list-card-price-num">${esc(priceText)}</span>
          </div>
        </div>
      </div>`;
    }
    // v2.154: 숫자에 콤마만 붙이는 간단한 포맷(popup.js의 numFmt는 이 문서에 없음).
    function numFmtSimple(v) {
      const n = typeof v === "number" ? v : parseFloat(String(v || "").replace(/,/g, ""));
      return isNaN(n) || !v ? "" : n.toLocaleString("ko-KR");
    }
    function renderListPanel(items) {
      if (!items.length) {
        listPanelEl.innerHTML = `<div class="list-empty">지도에 표시된 매물이 없습니다.</div>`;
        return;
      }
      listPanelEl.innerHTML = items.map(buildListCard).join("");
      // v2.176: [기능 추가] 강조된(FOCUS_ID) 카드가 있으면 목록 패널 스크롤을 그
      // 카드로 자동 이동 - 목록이 길면 강조 표시만으로는 화면 밖이라 안 보일 수 있음.
      const focusedCard = listPanelEl.querySelector(".list-card-focus");
      if (focusedCard) focusedCard.scrollIntoView({ block: "nearest" });
    }
    // v2.176: [기능 추가] "매물소개" 즉석 미니 메모장 - popup.js의 openInlineEditor/
    // saveInlineEditor와 동일한 패턴(별도 문서라 로직만 복제). 저장은 이 페이지가
    // chrome.storage에 직접 접근할 수 없어(외부 페이지) background.js에 새로 추가한
    // "maemulon-update-field" 메시지로 위임한다(기존 maemulon-toggle-favorite와 동일한
    // 경유 구조).
    const miniEditorEl = document.getElementById("miniEditor");
    const miniEditorInputEl = document.getElementById("miniEditorInput");
    let miniEditorTarget = null; // { id, field }
    function openMiniEditor(cardEl, rowEl, rec, field) {
      miniEditorTarget = { id: rec.__매물번호, field };
      miniEditorInputEl.value = field === "매물소개" ? computeIntroMap(rec) : (rec[field] || "");
      const rect = rowEl.getBoundingClientRect();
      const left = Math.min(rect.left, window.innerWidth - 280);
      const top = Math.min(rect.bottom + 4, window.innerHeight - 160);
      miniEditorEl.style.left = Math.max(4, left) + "px";
      miniEditorEl.style.top = Math.max(4, top) + "px";
      miniEditorEl.style.display = "block";
      miniEditorInputEl.focus();
      miniEditorInputEl.select();
    }
    function closeMiniEditor() {
      miniEditorEl.style.display = "none";
      miniEditorTarget = null;
    }
    async function saveMiniEditor() {
      if (!miniEditorTarget) return;
      const { id, field } = miniEditorTarget;
      const value = miniEditorInputEl.value;
      const item = currentMarkerData.find((d) => d.id === id);
      const res = await sendToExtension({ type: "maemulon-update-field", id, field, value });
      if (!res || !res.ok) { alert("저장에 실패했습니다. 잠시 후 다시 시도해주세요."); return; }
      // 낙관적 갱신: 화면에 보이는 rec 객체도 같이 갱신(다음 렌더링부터 바로 반영).
      if (item) {
        item.rec[field] = value;
        if (field === "매물소개") item.rec.__매물소개Manual = true;
      }
      closeMiniEditor();
      renderListPanel(currentMarkerData);
    }
    document.getElementById("miniEditorSave").addEventListener("click", saveMiniEditor);
    document.getElementById("miniEditorCancel").addEventListener("click", closeMiniEditor);
    listPanelEl.addEventListener("click", (e) => {
      const heart = e.target.closest(".list-card-heart");
      if (heart) {
        const item = currentMarkerData.find((d) => d.id === heart.dataset.id);
        if (item) {
          const active = toggleFavorite(item.rec);
          heart.classList.toggle("active", active);
          heart.textContent = active ? "♥" : "♡";
        }
        return;
      }
      // v2.176: [기능 추가] "매물소개" 줄 - 즉석 미니 메모장으로 수정.
      const miniField = e.target.closest(".nls-mini-editable");
      if (miniField) {
        const cardEl = miniField.closest(".list-card");
        const item = currentMarkerData.find((d) => d.id === cardEl.dataset.id);
        if (item) openMiniEditor(cardEl, miniField, item.rec, miniField.dataset.miniField);
        return;
      }
      // v2.176: [기능 추가] 여러 필드가 합쳐진 줄(매물코드+주소/제목+종류+면적/
      // 거래유형+가격) - popup.js의 area-open 관례와 동일하게 전체 수정창을 연다.
      const editOpen = e.target.closest(".nls-edit-open");
      if (editOpen) {
        const cardEl = editOpen.closest(".list-card");
        if (cardEl) sendToExtension({ type: "maemulon-open-edit", id: cardEl.dataset.id });
        return;
      }
      // v2.154: [요청 반영] 카드의 나머지 부분(썸네일 등) 클릭 -> 해당 마커로 지도 이동
      // (정보창 없이). 4줄이 각각 위에서 처리되므로 여기는 주로 썸네일 클릭이 해당.
      const card = e.target.closest(".list-card");
      if (card) {
        const item = currentMarkerData.find((d) => d.id === card.dataset.id);
        if (item) {
          mapInstance.panTo(item.pos);
          if (mapInstance.getLevel() > 4) mapInstance.setLevel(4);
        }
      }
    });

    // v2.101: 카카오 공식 사이트의 "지도유형" 체크박스(위성도/지적도/지형도)를
    // 직접 구현. 위성도는 기본지도(ROADMAP)<->위성+라벨(HYBRID) 전환, 지적도/지형도는
    // 오버레이로 켜고 끈다(지적도는 기본 체크 상태로 시작).
    function wireLayerControl() {
      const chkSkyview = document.getElementById("chkSkyview");
      const chkDistrict = document.getElementById("chkDistrict");
      const chkTerrain = document.getElementById("chkTerrain");
      chkSkyview.addEventListener("change", () => {
        mapInstance.setMapTypeId(chkSkyview.checked ? kakao.maps.MapTypeId.HYBRID : kakao.maps.MapTypeId.ROADMAP);
      });
      chkDistrict.addEventListener("change", () => {
        if (chkDistrict.checked) mapInstance.addOverlayMapTypeId(kakao.maps.MapTypeId.USE_DISTRICT);
        else mapInstance.removeOverlayMapTypeId(kakao.maps.MapTypeId.USE_DISTRICT);
      });
      chkTerrain.addEventListener("change", () => {
        if (chkTerrain.checked) mapInstance.addOverlayMapTypeId(kakao.maps.MapTypeId.TERRAIN);
        else mapInstance.removeOverlayMapTypeId(kakao.maps.MapTypeId.TERRAIN);
      });
    }

    // v2.101: "현재위치" 버튼 - 브라우저 위치 정보로 지도를 그 위치로 이동하고 마커 표시
    function wireLocateButton() {
      let locateMarker = null;
      document.getElementById("btnLocate").addEventListener("click", () => {
        if (!navigator.geolocation) { alert("이 브라우저에서는 현재 위치를 지원하지 않습니다."); return; }
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const loc = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
            mapInstance.setCenter(loc);
            mapInstance.setLevel(4);
            if (locateMarker) locateMarker.setMap(null);
            locateMarker = new kakao.maps.Marker({ position: loc, map: mapInstance });
          },
          () => alert("현재 위치를 가져오지 못했습니다. 위치 권한을 허용해주세요."),
        );
      });
    }

    // v2.113: "처음위치" - 지도를 최초 진입 시 기본 위치/줌으로 되돌린다.
    function wireHomeButton() {
      document.getElementById("btnHome").addEventListener("click", () => {
        mapInstance.setCenter(new kakao.maps.LatLng(DEFAULT_MAP_LAT, DEFAULT_MAP_LNG));
        mapInstance.setLevel(DEFAULT_MAP_LEVEL);
      });
    }

    // v2.112: 확대/축소 + 거리재기/면적재기/반경재기. 로드뷰 선택 모드와 서로 배타적으로
    // 동작해야 해서(둘 다 지도 클릭 이벤트를 쓰므로), window.__stopMeasureMode /
    // window.__stopRoadviewSelecting 라는 작은 전역 훅으로 서로를 꺼준다.
    function wireMeasureTools() {
      const btnZoomIn = document.getElementById("btnZoomIn");
      const btnZoomOut = document.getElementById("btnZoomOut");
      const btnDistance = document.getElementById("btnDistance");
      const btnArea = document.getElementById("btnArea");
      const btnRadius = document.getElementById("btnRadius");

      btnZoomIn.addEventListener("click", () => mapInstance.setLevel(mapInstance.getLevel() - 1));
      btnZoomOut.addEventListener("click", () => mapInstance.setLevel(mapInstance.getLevel() + 1));

      function distanceMeters(a, b) {
        const R = 6371000;
        const toRad = (d) => (d * Math.PI) / 180;
        const dLat = toRad(b.getLat() - a.getLat());
        const dLng = toRad(b.getLng() - a.getLng());
        const lat1 = toRad(a.getLat());
        const lat2 = toRad(b.getLat());
        const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
        return 2 * R * Math.asin(Math.sqrt(h));
      }
      function fmtDist(m) {
        return m >= 1000 ? `${(m / 1000).toFixed(2)}km` : `${m.toFixed(1)}m`;
      }
      // 폴리곤 면적 계산용: 평균위도를 기준으로 위경도를 근사 평면좌표(m)로 변환 후 신발끈 공식 적용.
      function toXY(pos, refLat) {
        const R = 6371000;
        const toRad = (d) => (d * Math.PI) / 180;
        return {
          x: toRad(pos.getLng()) * R * Math.cos(toRad(refLat)),
          y: toRad(pos.getLat()) * R,
        };
      }
      function polygonAreaM2(points) {
        if (points.length < 3) return 0;
        const refLat = points.reduce((s, p) => s + p.getLat(), 0) / points.length;
        const xy = points.map((p) => toXY(p, refLat));
        let sum = 0;
        for (let i = 0; i < xy.length; i++) {
          const a = xy[i];
          const b = xy[(i + 1) % xy.length];
          sum += a.x * b.y - b.x * a.y;
        }
        return Math.abs(sum) / 2;
      }
      function fmtArea(m2) {
        return `${m2.toFixed(1)}㎡ (${(m2 / 3.3058).toFixed(1)}평)`;
      }

      const vertexImage = new kakao.maps.MarkerImage(
        "data:image/svg+xml;charset=UTF-8," +
          encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10"><circle cx="5" cy="5" r="4" fill="#3182f6" stroke="#fff" stroke-width="1.5"/></svg>'),
        new kakao.maps.Size(10, 10),
      );

      // 도구별 상태는 서로 독립적으로 유지한다(도구를 바꿔도 다른 도구가 그려둔
      // 도형은 지워지지 않고, 같은 도구를 다시 눌렀을 때만 새로 시작하며 지운다).
      function createToolState() {
        return { points: [], vertexMarkers: [], shape: null, rubber: null, label: null, segmentLabels: [] };
      }
      const state = { distance: createToolState(), area: createToolState(), radius: { center: null, circle: null, marker: null, label: null } };
      let mode = null; // 'distance' | 'area' | 'radius' | null
      let suppressMapClick = false; // v2.115: 닫기(×) 버튼 클릭이 지도 클릭으로 새어나가 점이 추가되는 것을 막는 플래그
      const buttons = { distance: btnDistance, area: btnArea, radius: btnRadius };

      function clearLabel(st) {
        if (st.label) { st.label.setMap(null); st.label = null; }
      }
      // v2.113: 라벨에 "닫기(×)" 버튼을 함께 넣어, 도구를 다시 클릭하지 않고도
      // 그 자리에서 바로 측정 결과를 지울 수 있게 한다. onClose는 closeTool()로 연결.
      function showLabel(st, pos, text, onClose) {
        if (!st.label) {
          st.label = new kakao.maps.CustomOverlay({ position: pos, xAnchor: 0, yAnchor: 1.4, zIndex: 30 });
          st.label.setMap(mapInstance);
        } else {
          st.label.setPosition(pos);
        }
        const el = document.createElement("div");
        el.className = "measure-label";
        const span = document.createElement("span");
        span.textContent = text;
        const closeBtn = document.createElement("button");
        closeBtn.type = "button";
        closeBtn.className = "measure-close";
        closeBtn.textContent = "×";
        closeBtn.title = "닫기";
        // v2.115: [버그 수정] 반경재기는 X를 눌러도 잘 꺼지는데 거리재기/면적재기는 안
        // 꺼지는 문제 - 카카오맵이 "클릭"을 판정하는 시점이 브라우저의 click 이벤트보다
        // 이를 수 있어서(mousedown 시점에 이미 지도쪽에서 클릭으로 처리해버림),
        // click에서만 stopPropagation해서는 늦을 수 있음. mousedown 단계에서부터
        // suppressMapClick 플래그를 세워, 지도의 click 핸들러 맨 앞에서 이를 확인해
        // 걸러내는 이중 방어 장치를 추가.
        closeBtn.addEventListener("mousedown", (ev) => { ev.stopPropagation(); suppressMapClick = true; });
        closeBtn.addEventListener("click", (ev) => { ev.stopPropagation(); onClose(); });
        el.appendChild(span);
        el.appendChild(closeBtn);
        st.label.setContent(el);
      }
      function clearSegmentLabels(st) {
        st.segmentLabels.forEach((ov) => ov.setMap(null));
        st.segmentLabels = [];
      }
      // v2.113: [기능 추가] 총 합계뿐 아니라 각 구간(변)의 길이도 그 구간 중점에 작게 표시.
      function updateSegmentLabels(st, closeLoop) {
        clearSegmentLabels(st);
        const pts = st.points;
        const segCount = closeLoop ? pts.length : pts.length - 1;
        for (let i = 0; i < segCount; i++) {
          const a = pts[i];
          const b = pts[(i + 1) % pts.length];
          const d = distanceMeters(a, b);
          const mid = new kakao.maps.LatLng((a.getLat() + b.getLat()) / 2, (a.getLng() + b.getLng()) / 2);
          const ov = new kakao.maps.CustomOverlay({ position: mid, zIndex: 25 });
          const el = document.createElement("div");
          el.className = "segment-label";
          el.textContent = fmtDist(d);
          ov.setContent(el);
          ov.setMap(mapInstance);
          st.segmentLabels.push(ov);
        }
      }
      function resetLineOrPolyState(st) {
        st.vertexMarkers.forEach((m) => m.setMap(null));
        st.vertexMarkers = [];
        st.points = [];
        if (st.shape) { st.shape.setMap(null); st.shape = null; }
        if (st.rubber) { st.rubber.setMap(null); st.rubber = null; }
        clearLabel(st);
        clearSegmentLabels(st);
      }
      function resetRadiusState() {
        if (state.radius.circle) { state.radius.circle.setMap(null); state.radius.circle = null; }
        if (state.radius.marker) { state.radius.marker.setMap(null); state.radius.marker = null; }
        clearLabel(state.radius);
        state.radius.center = null;
      }
      // v2.113: [기능 추가] 라벨의 "×" 버튼이나 도구를 다시 눌렀을 때, 해당 도구의
      // 도형/라벨을 완전히 지운다(측정 중이었다면 모드도 함께 종료).
      function closeTool(name) {
        if (mode === name) stopMode();
        if (name === "radius") resetRadiusState();
        else resetLineOrPolyState(state[name]);
      }

      function stopMode() {
        if (mode && buttons[mode]) buttons[mode].classList.remove("active");
        mode = null;
        document.getElementById("map").style.cursor = "";
      }
      window.__stopMeasureMode = stopMode;

      function startMode(next) {
        if (mode === next) { stopMode(); return; }
        if (window.__stopRoadviewSelecting) window.__stopRoadviewSelecting();
        stopMode();
        mode = next;
        buttons[next].classList.add("active");
        document.getElementById("map").style.cursor = "crosshair";
        if (next === "distance" || next === "area") resetLineOrPolyState(state[next]);
        else resetRadiusState();
      }
      btnDistance.addEventListener("click", () => startMode("distance"));
      btnArea.addEventListener("click", () => startMode("area"));
      btnRadius.addEventListener("click", () => startMode("radius"));

      kakao.maps.event.addListener(mapInstance, "click", (e) => {
        if (suppressMapClick) { suppressMapClick = false; return; }
        if (!mode) return;
        const pos = e.latLng;
        if (mode === "radius") {
          if (!state.radius.center) {
            state.radius.center = pos;
            state.radius.marker = new kakao.maps.Marker({ position: pos, image: vertexImage, map: mapInstance });
            state.radius.circle = new kakao.maps.Circle({
              center: pos, radius: 1, strokeWeight: 2, strokeColor: "#3182f6", strokeOpacity: 0.9,
              fillColor: "#3182f6", fillOpacity: 0.15, map: mapInstance,
            });
          } else {
            // v2.140: [버그 수정] 라벨(닫기 × 버튼 포함)이 mousemove 핸들러에서만
            // 그려지고 있어서, 두 번째 클릭(반경 확정) 전에 마우스를 전혀 움직이지
            // 않으면(예: 빠르게 두 번 클릭) 닫기 버튼이 한 번도 표시되지 않는 문제가
            // 있었다 - 거리재기/면적재기처럼 클릭 시점에도 직접 showLabel을 호출해서
            // 마우스 움직임과 무관하게 항상 닫기 버튼이 뜨도록 함.
            const center = state.radius.center;
            const r = distanceMeters(center, pos);
            state.radius.circle.setRadius(r);
            showLabel(state.radius, pos, `반경 ${fmtDist(r)} (면적 ${fmtArea(Math.PI * r * r)})`, () => closeTool("radius"));
            state.radius.center = null; // 반경 확정, 다음 클릭부터 새 원 시작
          }
          return;
        }
        const st = state[mode];
        st.points.push(pos);
        st.vertexMarkers.push(new kakao.maps.Marker({ position: pos, image: vertexImage, map: mapInstance }));
        if (mode === "distance") {
          if (!st.shape) st.shape = new kakao.maps.Polyline({ path: st.points, strokeWeight: 3, strokeColor: "#3182f6", strokeOpacity: 0.9, map: mapInstance });
          else st.shape.setPath(st.points);
          if (st.points.length > 1) {
            let total = 0;
            for (let i = 1; i < st.points.length; i++) total += distanceMeters(st.points[i - 1], st.points[i]);
            showLabel(st, pos, `총 거리 ${fmtDist(total)}`, () => closeTool("distance"));
            updateSegmentLabels(st, false);
          }
        } else if (mode === "area") {
          if (st.points.length >= 3) {
            if (st.shape instanceof kakao.maps.Polygon) {
              st.shape.setPath(st.points);
            } else {
              if (st.shape) st.shape.setMap(null);
              st.shape = new kakao.maps.Polygon({ path: st.points, strokeWeight: 2, strokeColor: "#3182f6", strokeOpacity: 0.9, fillColor: "#3182f6", fillOpacity: 0.15, map: mapInstance });
            }
            showLabel(st, pos, `면적 ${fmtArea(polygonAreaM2(st.points))}`, () => closeTool("area"));
            updateSegmentLabels(st, true);
          } else {
            if (!st.shape) st.shape = new kakao.maps.Polyline({ path: st.points, strokeWeight: 2, strokeColor: "#3182f6", strokeOpacity: 0.9, map: mapInstance });
            else st.shape.setPath(st.points);
          }
        }
      });

      kakao.maps.event.addListener(mapInstance, "mousemove", (e) => {
        if (!mode) return;
        const pos = e.latLng;
        if (mode === "radius") {
          if (!state.radius.center || !state.radius.circle) return;
          const r = distanceMeters(state.radius.center, pos);
          state.radius.circle.setRadius(r);
          showLabel(state.radius, pos, `반경 ${fmtDist(r)} (면적 ${fmtArea(Math.PI * r * r)})`, () => closeTool("radius"));
        } else {
          const st = state[mode];
          if (!st.points.length) return;
          const path = st.points.concat([pos]);
          if (!st.rubber) st.rubber = new kakao.maps.Polyline({ path, strokeWeight: 2, strokeColor: "#3182f6", strokeOpacity: 0.5, strokeStyle: "shortdash", map: mapInstance });
          else st.rubber.setPath(path);
        }
      });
    }

    // v2.105: "로드뷰(선택)" - 켜면 도로 위에 파란선(로드뷰 지원 구간)이 표시되고,
    // 그 선을 클릭하면 화면이 왼쪽(지도)/오른쪽(로드뷰) 절반씩 나뉘어 크게 보인다.
    // 로드뷰 사진 안에서 이동/회전하면(position_changed) 지도 위 빨간 점이 같이
    // 움직이고, 반대로 지도의 파란선을 다시 클릭하면 로드뷰 사진이 그 위치로 바뀐다.
    function wireRoadview() {
      const btn = document.getElementById("btnRoadview");
      const split = document.getElementById("roadviewSplit");
      const inner = document.getElementById("roadviewInner");
      const closeBtn = document.getElementById("roadviewClose");
      const roadviewClient = new kakao.maps.RoadviewClient();
      const roadviewMarkerImage = new kakao.maps.MarkerImage(
        "data:image/svg+xml;charset=UTF-8," +
          encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"><circle cx="11" cy="11" r="8" fill="#f04452" stroke="#fff" stroke-width="3"/></svg>'),
        new kakao.maps.Size(22, 22),
      );
      let roadview = null;
      let roadviewMarker = null;
      let selecting = false;

      // v2.108: [버그 수정 아님, 요청 반영] "빨간 점을 화면 정중앙에 맞추는" 시도가
      // 아니라, 로드뷰와의 경계선으로부터 왼쪽으로 일정 거리(약 5~7cm) 띄운
      // 위치에 항상 오도록 지도를 의도적으로 오른쪽으로 치우쳐 센터를 잡는다.
      const ROADVIEW_MARKER_LEFT_OFFSET_PX = 220; // 화면 96dpi 기준 약 6cm

      function relayoutMap() {
        // v2.107: [버그 수정] "resize" 이벤트를 강제로 흘려보내는 방식은 실제로
        // 카카오맵에 아무 효과가 없었음(진짜 리레이아웃 함수가 아님) - 지도
        // 컨테이너 크기가 바뀌었을 때 다시 계산해주는 진짜 함수(map.relayout())로 교체.
        mapInstance.relayout();
      }

      // v2.108: pos가 지도의 "정중앙"이 아니라, 오른쪽 경계선에서 왼쪽으로
      // ROADVIEW_MARKER_LEFT_OFFSET_PX만큼 떨어진 지점에 오도록 하는 중심좌표 계산.
      function roadviewCenterFor(pos) {
        const mapEl = document.getElementById("map");
        const w = mapEl.clientWidth;
        const proj = mapInstance.getProjection();
        const centerPoint = proj.pointFromCoords(pos);
        centerPoint.x -= (w / 2 - ROADVIEW_MARKER_LEFT_OFFSET_PX);
        return proj.coordsFromPoint(centerPoint);
      }
      function stopSelecting() {
        selecting = false;
        btn.classList.remove("active");
        document.getElementById("map").style.cursor = "";
        mapInstance.removeOverlayMapTypeId(kakao.maps.MapTypeId.ROADVIEW);
      }
      function closeRoadview() {
        split.style.display = "none";
        if (roadviewMarker) { roadviewMarker.setMap(null); roadviewMarker = null; }
        roadview = null;
        relayoutMap();
        stopSelecting();
      }

      btn.addEventListener("click", () => {
        if (selecting) { stopSelecting(); return; }
        if (window.__stopMeasureMode) window.__stopMeasureMode();
        selecting = true;
        btn.classList.add("active");
        document.getElementById("map").style.cursor = "crosshair";
        mapInstance.addOverlayMapTypeId(kakao.maps.MapTypeId.ROADVIEW);
      });
      closeBtn.addEventListener("click", closeRoadview);
      window.__stopRoadviewSelecting = stopSelecting;

      function showRoadviewAt(pos, panoId) {
        const wasHidden = split.style.display !== "flex";
        split.style.display = "flex";
        if (wasHidden) {
          // v2.106: [버그 수정] 화면을 절반으로 나누자마자(display:flex) 바로
          // 리레이아웃/센터 이동을 하면, 브라우저가 아직 실제 레이아웃(폭 변경)을
          // 반영하기 전이라 카카오맵이 "옛날 넓이" 기준으로 계산해서 빨간 점이
          // 화면 중앙이 아니라 오른쪽 경계 쪽에 쏠려 보이던 문제 - 브라우저가
          // 레이아웃을 실제로 끝낸 다음 프레임에 다시 계산하도록 미룸.
          requestAnimationFrame(() => {
            relayoutMap();
            mapInstance.setCenter(roadviewCenterFor(pos));
          });
        } else {
          relayoutMap();
          mapInstance.setCenter(roadviewCenterFor(pos));
        }
        if (!roadview) {
          roadview = new kakao.maps.Roadview(inner);
          kakao.maps.event.addListener(roadview, "position_changed", () => {
            const p = roadview.getPosition();
            if (!roadviewMarker) {
              roadviewMarker = new kakao.maps.Marker({ position: p, map: mapInstance, image: roadviewMarkerImage });
            } else {
              roadviewMarker.setPosition(p);
            }
            mapInstance.panTo(roadviewCenterFor(p));
          });
        }
        roadview.setPanoId(panoId, pos);
      }

      kakao.maps.event.addListener(mapInstance, "click", (mouseEvent) => {
        if (!selecting) return;
        const pos = mouseEvent.latLng;
        // v2.102: 탐색 반경 50m가 너무 좁아 거의 항상 "지원하지 않음"으로 실패하던
        // 문제 - 300m로 넓혀서 도로에서 조금 벗어나 클릭해도 찾도록 함.
        roadviewClient.getNearestPanoId(pos, 300, (panoId) => {
          if (!panoId) { alert("이 위치는 로드뷰를 지원하지 않습니다."); return; }
          showRoadviewAt(pos, panoId);
        });
      });

      new ResizeObserver(() => { if (roadview) roadview.relayout(); }).observe(split);
    }

    // ===================== v2.143: 필터바(지역/거래유형·매물종류/검색) =====================
    // popup.js의 동일 기능(v2.132~v2.142)을 이 페이지용으로 이식. 목록창은 chrome.storage를
    // 실시간 구독해서 다시 읽지만, 이 지도창은 페이지 로드 시점에 한 번 받아온 전체 배열
    // (allListings)을 그대로 두고 클라이언트에서 걸러서 마커만 다시 그린다(목록창처럼
    // storage를 다시 읽을 필요가 없어 오히려 더 간단함).
    let allListings = [];

    const SIDO_ORDER = [

    ];
    function sortKo(arr) { return [...arr].sort((a, b) => a.localeCompare(b, "ko")); }

    // v2.143: [알려진 제한, 명시] 목록창의 검색(matchesQuery)은 엑셀 전체 컬럼(COLUMN_DEFS)을
    // 대상으로 하지만, 이 페이지는 COLUMN_DEFS를 안 갖고 있어 마커 정보창에 쓰는 핵심
    // 필드 몇 개로만 검색한다(제목/매물소개/타이틀/거래유형/매물종류/지번/지역/중개사).
    // v2.165: [기능 삭제] "전체주소" 필드 폐지 - "지번"이 이미 목록에 있어 그대로 유지.
    // v2.176: [버그 수정] 검색 대상 필드가 9개뿐이라 매물목록창(popup.js의 COLUMN_DEFS
    // 전체 - 건축물정보/URL/중개사(1)/평당가 등)보다 좁았던 문제 - "매물목록창과 검색
    // 방법을 동일하게" 요청에 맞춰 popup.js와 동일한 필드 목록으로 확장.
    const MAP_SEARCH_FIELDS = [
      "제목", "거래유형", "매물종류", "매매가", "전세가", "월세", "대지면적", "연면적",
      "공급면적", "전용면적", "지상/지하", "해당층/총층", "평당가", "보증금", "월임차료",
      "수익율", "월관리비", "입주가능일", "지역", "지번", "시·도", "시·군·구", "법정동",
      "중개사(2)", "URL", "기본정보", "건축물정보", "타이틀", "중개사(1)", "등록시간", "등록일자",
    ];
    function matchesMapQuery(rec, q) {
      if (!q) return true;
      const haystack = MAP_SEARCH_FIELDS
        .map((key) => rec[key])
        .concat([computeIntroMap(rec)])
        .filter(Boolean).join(" ").toLowerCase();
      return haystack.includes(q);
    }
    function computeFilteredListings() {
      const q = currentQuery.trim().toLowerCase();
      let pool = allListings.filter((rec) => matchesMapQuery(rec, q));
      // v2.132 원본과 동일: 구조화된 지역코드가 매물 데이터에 없어 지번/지역
      // 문자열에 선택한 시군구·읍면동명이 포함되는지로 매칭.
      // v2.165: "전체주소" 폐지로 매칭 대상도 "지번"으로 변경.
      if (selectedRegion.sgg) {
        pool = pool.filter((rec) => {
          const addr = `${rec["지번"] || ""} ${rec["지역"] || ""}`;
          if (!addr.includes(selectedRegion.sgg)) return false;
          if (selectedRegion.emdSet.size === 0) return true;
          return [...selectedRegion.emdSet].some((emd) => addr.includes(emd));
        });
      }
      if (selectedDealTypes.size) pool = pool.filter((rec) => selectedDealTypes.has(rec["거래유형"]));
      if (selectedPropertyTypes.size) {
        pool = pool.filter((rec) => {
          const t = rec["매물종류"] || "";
          return [...selectedPropertyTypes].some((sel) => t.includes(sel));
        });
      }
      return pool;
    }
    // v2.143: 필터를 바꿀 때마다 압구정역(기본 위치)으로 화면이 튀면 불편하므로,
    // 필터 조작으로 인한 재렌더링은 항상 resetView=false(현재 보던 위치/확대 유지).
    function refreshMapFilterView(resetView) {
      // v2.163: main()이 초기 렌더링 완료 후에 applyFocusMarker()를 실행할 수 있도록
      // renderListings의 Promise를 그대로 반환한다(기존 호출부들은 반환값을 안 써도 무방).
      return renderListings(computeFilteredListings(), !!resetView);
    }

      // 지금은 버튼 표시(단위 전환 라벨)만 동일하게 두고 실제 화면 변화는 없음.

    // ===== ①지역선택 팝업(popup.js openRegionPopup 계열 이식) =====
    const regionPopupEl = document.getElementById("regionFilterPopup");
    const regionBreadcrumbEl = document.getElementById("regionBreadcrumb");
    const regionGridEl = document.getElementById("regionGrid");
    let regionNav = { sido: "", sgg: "", emdSet: new Set() };

    function updateRegionButtonLabel() {
      const btn = document.getElementById("btnRegionFilter");
      if (!selectedRegion.sgg) {
        btn.innerHTML = `지역 전체 <span class="dd-caret">▾</span>`;
        btn.classList.remove("filter-dropdown-selected");
        return;
      }
      const emds = [...selectedRegion.emdSet];
      let label = SIDO_SHORT_NAME[selectedRegion.sgg] || selectedRegion.sgg;
      if (emds.length === 1) label += ` ${emds[0]}`;
      else if (emds.length > 1) label += ` ${emds[0]} +${emds.length - 1}`;
      btn.innerHTML = `${esc(label)} <span class="dd-caret">▾</span>`;
      btn.classList.add("filter-dropdown-selected");
    }
    function sggKeysOf(sido) {
      const node = REGION_DB[sido];
      if (!node) return [];
      return Object.keys(node.sgg);
    }
    function directEmdOnly(sido) {
      const keys = sggKeysOf(sido);
      return keys.length === 1 && keys[0] === "";
    }
    const regionSearchEl = document.getElementById("regionSearchInput");
    regionSearchEl.addEventListener("input", () => {
      const q = regionSearchEl.value.trim();

        b.classList.toggle("hidden-by-search", q && !b.textContent.includes(q));
      });
    });
    function renderRegionPopup() {
      regionSearchEl.style.display = "none";
      regionSearchEl.value = "";
      const crumbs = [];
      crumbs.push(regionNav.sido
        ? `<span class="crumb-link" data-level="sido">${esc(SIDO_SHORT_NAME[regionNav.sido] || regionNav.sido)}</span>`
        : "시·도");
      crumbs.push(regionNav.sido && !directEmdOnly(regionNav.sido)
        ? (regionNav.sgg ? `<span class="crumb-link" data-level="sgg">${esc(regionNav.sgg)}</span>` : "시·군·구 선택")
        : null);
      crumbs.push((regionNav.sido && (directEmdOnly(regionNav.sido) || regionNav.sgg)) ? "읍·면·동 선택(여러 개 가능)" : null);
      regionBreadcrumbEl.innerHTML = crumbs.filter(Boolean).join(" &rsaquo; ");

      regionGridEl.innerHTML = "";

      if (!regionNav.sido) {
        SIDO_ORDER.filter((sido) => REGION_DB[sido]).forEach((sido) => {
          const b = document.createElement("button");
          b.type = "button";
          b.textContent = SIDO_SHORT_NAME[sido] || sido;
          b.addEventListener("click", () => {
            regionNav = { sido, sgg: "", emdSet: new Set() };
            renderRegionPopup();
          });
          regionGridEl.appendChild(b);
        });
        return;
      }
      if (!directEmdOnly(regionNav.sido) && !regionNav.sgg) {
        sortKo(sggKeysOf(regionNav.sido)).forEach((sgg) => {
          const b = document.createElement("button");
          b.type = "button";
          b.textContent = sgg;

            renderRegionPopup();
          });

          renderRegionPopup();
        });
        regionGridEl.appendChild(b);

    function openRegionPopup() {

      // 안에서 조용히(콘솔에만) 오류가 나며 팝업이 안 뜬다 - 화면에 원인을 바로 보여줌.
      if (typeof REGION_DB === "undefined") {
        alert("지역 데이터(region-db.js)를 불러오지 못했습니다.\nGitHub Pages 저장소(hic71991-0928/maemulon-map)에 kakao-map.html과 함께 region-db.js 파일도 업로드되어 있는지 확인해 주세요.");

      regionPopupEl.style.display = "block";
    }

    document.getElementById("btnRegionFilter").addEventListener("click", () => {

        btn.innerHTML = `거래유형·매물종류 전체 <span class="dd-caret">▾</span>`;

      btn.classList.add("filter-dropdown-selected");

      ).join("");

        `<div class="filter-chip-grid">${items.map((t) =>
          `<button type="button" data-kind="property" data-val="${esc(t)}" class="${selectedPropertyTypes.has(t) ? "selected" : ""}">${esc(PROPERTY_TYPE_LABELS[t] || t)}</button>`
        ).join("")}</div>`

      dealTypePopupEl.style.display = "block";

    function closeDealTypePopup() { dealTypePopupEl.style.display = "none"; }

    async function main() {
      try {
        await loadKakaoSdk();
      } catch (e) {
        setStatus("카카오맵 SDK를 불러오지 못했습니다. 키 또는 카카오 콘솔의 Web 플랫폼(도메인) 등록을 확인해주세요.", true);
        return;
      }
      kakao.maps.load(async () => {
        mapInstance = new kakao.maps.Map(document.getElementById("map"), {
          center: new kakao.maps.LatLng(DEFAULT_MAP_LAT, DEFAULT_MAP_LNG), // 매물이 없을 때 기본 중심(압구정역)
          level: DEFAULT_MAP_LEVEL,
        });
        // v2.171: [요청 반영] 일반 매물 마커 크기 40% 축소용 커스텀 이미지 준비.
        defaultMarkerImage = new kakao.maps.MarkerImage(
          "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" width="17" height="25" viewBox="0 0 29 42">' +
            '<path d="M14.5 0C6.5 0 0 6.5 0 14.5c0 11 14.5 27.5 14.5 27.5s14.5-16.5 14.5-27.5C29 6.5 22.5 0 14.5 0z" fill="#3182f6"/>' +
            '<circle cx="14.5" cy="14.5" r="6" fill="#fff"/></svg>'
          ),
          new kakao.maps.Size(17, 25),
          { offset: new kakao.maps.Point(8, 25) }
        );
        // v2.101: 기본값을 지적편집도(지번지도)로 고정해서 켜둠(체크박스도 기본 체크)
        mapInstance.addOverlayMapTypeId(kakao.maps.MapTypeId.USE_DISTRICT);
        wireLayerControl();
        wireLocateButton();
        wireHomeButton();
        wireMeasureTools();
        wireRoadview();

        if (!EXT_ID) {
          setStatus("이 페이지는 매물on 확장 프로그램의 '지도보기' 버튼으로 열어야 동작합니다.", true);
          return;
        }
        const response = await sendToExtension({ type: "maemulon-ready" });
        if (response && Array.isArray(response.list)) {
          allListings = response.list;
          await refreshMapFilterView(true); // v2.143: 필터 없는 최초 로드 = 전체 목록, 기본 위치로 시작
          await applyFocusMarker(); // v2.163: focusId/focusLat/focusLng로 열렸으면 그 매물 위치로 이동+강조
        } else setStatus("확장 프로그램에서 매물 데이터를 받아오지 못했습니다." + (lastSendError ? ` (사유: ${lastSendError})` : ""), true);
      });
    }

    main();
  </script>
</body>
</html>

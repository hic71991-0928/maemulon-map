<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>매물on 지도</title>
<style>
  :root {
    --toss-blue: #3182f6;
    --toss-blue-dark: #1b64da;
    --toss-blue-bg: #eef4ff;
    --toss-text: #191f28;
    --toss-text-sub: #4e5968;
    --toss-text-mute: #8b95a1;
    --toss-bg: #f9fafb;
    --toss-line: #e5e8eb;
    --toss-line-strong: #d1d6db;
    --toss-red: #f04452;
    --toss-red-bg: #fff0f1;
  }
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  /* v2.143: [요청 반영] body를 세로 flex 컬럼으로 바꿔서 상단바들(topbar/filterbar/
     toolbar)은 내용만큼만 차지하고 지도(#mapWrap)가 나머지 공간을 전부 채우게 함 -
     예전처럼 height:calc(100% - 37px) 같은 하드코딩된 픽셀 계산에 기대지 않아도 됨. */
  body { display: flex; flex-direction: column; }
  #topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    background: #fff;
    border-bottom: 1px solid var(--toss-line);
    font-size: 13px;
    color: var(--toss-text-sub);
  }
  #topbar strong { color: var(--toss-text); }
  /* v2.115: 지금 보고 있는 페이지가 최신 파일인지 눈으로 바로 확인할 수 있도록
     버전 배지를 눈에 띄게 표시(GitHub Pages/브라우저 캐시로 옛날 파일이 계속
     보이는 문제를 사용자가 직접 구분할 수 있게 하기 위함). */
  #buildTag {
    background: #f04452;
    color: #fff;
    font-weight: 700;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
  }
  #status.error { color: #f04452; }

  /* v2.143: [기능 추가] 목록창(popup.html)의 필터바(지역/거래유형·매물종류/검색/
     초기화/㎡)와 목록·지도 전환 버튼을 지도창에도 동일하게 구현. 이 페이지는 외부
     호스팅(GitHub Pages)이라 popup.css를 불러올 수 없어서, 필요한 클래스만 이 페이지
     스타일에 맞게 복제(popup.css v2.142 기준 - 진한 테두리/파란 배경/32px 높이 통일). */
  #mapFilterbar {
    flex: none;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 8px 14px;
    background: #fff;
    border-bottom: 1px solid var(--toss-line);
  }
  .filter-dropdowns { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-dropdown-btn {
    border: 1.5px solid var(--toss-text-sub);
    background: var(--toss-blue-bg);
    color: var(--toss-text);
    padding: 0 12px;
    height: 32px;
    display: inline-flex;
    align-items: center;
    border-radius: 9px;
    font-size: 13.3px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .filter-dropdown-btn:hover { border-color: var(--toss-blue); }
  .filter-dropdown-btn .dd-caret { color: var(--toss-text-mute); margin-left: 2px; }
  .filter-dropdown-btn.filter-dropdown-selected { background: #191f28; border-color: #191f28; color: #fff; }
  .filter-dropdown-btn.filter-dropdown-selected .dd-caret { color: #fff; }
  .search-group { display: flex; align-items: center; gap: 4px; }
  .search-group input[type="text"] {
    width: 200px;
    border: 1px solid var(--toss-red);
    background: var(--toss-red-bg);
    border-radius: 9px;
    padding: 0 10px;
    height: 32px;
    font-size: 13.3px;
    color: var(--toss-text);
    font-family: inherit;
  }
  .search-group input[type="text"]:focus { outline: none; border-color: var(--toss-red); background: #fff; }
  .search-group button {
    border: none;
    background: var(--toss-blue);
    color: #fff;
    padding: 0 12px;
    height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 9px;
    font-size: 13.3px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .search-group button:hover { background: var(--toss-blue-dark); }
  .search-group .btn-reset,
  .search-group .btn-area-unit {
    background: var(--toss-line);
    color: var(--toss-text-sub);
    border: 1.5px solid var(--toss-text-sub);
  }
  .search-group .btn-reset:hover,
  .search-group .btn-area-unit:hover { background: var(--toss-line-strong); }

  /* v2.143: [기능 추가] 정렬(자리만)/목록/지도 3버튼 - 목록창과 지도창에 동일하게 배치 */
  .view-switch { display: flex; align-items: center; gap: 4px; margin-left: auto; }
  .view-switch-btn {
    border: 1px solid var(--toss-line-strong);
    background: #fff;
    color: var(--toss-text-sub);
    padding: 0 12px;
    height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 9px;
    font-size: 13.3px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
  }
  .view-switch-btn:hover:not(:disabled) { border-color: var(--toss-blue); }
  .view-switch-btn:disabled { cursor: default; }
  .view-switch-btn.view-switch-active { background: #191f28; border-color: #191f28; color: #fff; }

  /* v2.132/v2.142 popup.css 이식: ①지역/②③거래유형·매물종류 팝업 */
  .filter-popup {
    position: fixed;
    z-index: 2000;
    width: 460px;
    background: #fff;
    border: 1px solid var(--toss-line-strong);
    border-radius: 14px;
    box-shadow: 0 12px 28px rgba(25, 31, 40, 0.2);
    padding: 12px;
    font-size: 13px;
    color: var(--toss-text);
  }
  .filter-popup-breadcrumb {
    font-size: 12.5px;
    color: var(--toss-text-sub);
    font-weight: 600;
    margin-bottom: 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .filter-popup-breadcrumb .crumb-link { color: var(--toss-blue); cursor: pointer; }
  .filter-popup-breadcrumb .crumb-link:hover { text-decoration: underline; }
  .filter-popup-search {
    width: 100%;
    box-sizing: border-box;
    padding: 7px 10px;
    margin-bottom: 8px;
    border: 1px solid var(--toss-line-strong);
    border-radius: 8px;
    font-size: 13.3px;
    background: var(--toss-bg);
    font-family: inherit;
  }
  .filter-popup-search:focus { outline: none; border-color: var(--toss-blue); background: #fff; }
  .filter-popup-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-auto-rows: min-content;
    align-content: start;
    gap: 6px;
    max-height: 360px;
    overflow-y: auto;
  }
  .filter-popup-grid button {
    border: 1px solid var(--toss-line-strong);
    background: var(--toss-bg);
    color: var(--toss-text);
    min-width: 0;
    padding: 8px 6px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: inherit;
  }
  .filter-popup-grid button:hover { border-color: var(--toss-blue); }
  .filter-popup-grid button.selected { background: #191f28; border-color: #191f28; color: #fff; }
  .filter-popup-grid button.hidden-by-search { display: none; }
  .filter-popup-footer { display: flex; justify-content: flex-end; gap: 6px; margin-top: 10px; }
  .filter-popup-footer button {
    border: none;
    background: var(--toss-line);
    color: var(--toss-text-sub);
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .filter-popup-footer button:hover { background: var(--toss-line-strong); }
  .filter-popup-footer button.primary { background: var(--toss-blue); color: #fff; }
  .filter-popup-footer button.primary:hover { background: var(--toss-blue-dark); }
  .filter-popup-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .filter-popup-header button {
    border: none;
    background: transparent;
    color: var(--toss-text-sub);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 6px;
    font-family: inherit;
  }
  .filter-popup-header button:hover { background: var(--toss-line); }
  .filter-popup-section-title { font-size: 12.5px; font-weight: 700; color: var(--toss-text); margin: 8px 0 6px; }
  .filter-chip-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .filter-chip-grid + .filter-chip-grid { margin-top: 14px; }
  .filter-chip-grid button {
    border: 1px solid var(--toss-line-strong);
    background: var(--toss-bg);
    color: var(--toss-text-sub);
    min-width: 0;
    padding: 8px 6px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: inherit;
  }
  .filter-chip-grid button:hover { border-color: var(--toss-blue); }
  .filter-chip-grid button.selected { background: var(--toss-text); border-color: var(--toss-text); color: #fff; }

  /* v2.105: 로드뷰를 떠 있는 작은 팝업 대신, 지도 옆에 화면을 절반씩 나눠 크게
     보여주는 방식으로 변경(밸류맵 등 참고 사이트 방식). */
  #mapWrap { flex: 1; min-height: 0; display: flex; width: 100%; }
  #map { flex: 1; min-width: 0; background: var(--toss-bg); }
  /* v2.144: [요청 반영] ③ 매물목록 패널 - 아직 기능은 없고, 나중에 실제로 붙일 때
     레이아웃이 안 깨지도록 자리만 미리 예약해 둔 자리표시자(placeholder). 폭은
     확정값이 아니라 나중에 얼마든지 바뀔 수 있음(지금은 임의로 280px). */
  #listPanelPlaceholder {
    flex: none;
    width: 280px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: var(--toss-bg);
    border-left: 1px dashed var(--toss-line-strong);
    color: var(--toss-text-mute);
    font-size: 13px;
    line-height: 1.6;
    padding: 20px;
  }
  #roadviewSplit {
    display: none;
    flex: 1;
    min-width: 0;
    flex-direction: column;
    border-left: 1px solid var(--toss-line);
  }
  #roadviewSplitBar {
    flex: none;
    height: 32px;
    background: rgba(0, 0, 0, 0.75);
    color: #fff;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px;
  }
  #roadviewClose { border: none; background: transparent; color: #fff; cursor: pointer; font-size: 14px; line-height: 1; padding: 2px 4px; }
  #roadviewInner { flex: 1; min-height: 0; }
  .info-window {
    padding: 8px 10px;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--toss-text);
    max-width: 220px;
  }
  .info-window b { display: block; margin-bottom: 3px; }
  .info-window button {
    margin-top: 6px;
    border: none;
    background: var(--toss-blue);
    color: #fff;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 6px;
    cursor: pointer;
  }
  /* v2.143: 아이콘 13개를 지도 우측 상단 세로 고정 배치(position:fixed)에서 필터바
     아래 가로 1줄로 옮겼었는데, 지도 폭 자체는 안 줄어들고 화면 위아래만 좁아지는
     효과라 요청과 달랐음.
     v2.144: [요청 반영] #mapWrap의 정상적인 flex 자식(세로 1열)으로 다시 배치 -
     이번엔 실제로 지도 폭이 그만큼 줄어들고("지도 좌우 축소"), position:fixed가
     아니므로 로드뷰 닫기 버튼과 겹칠 걱정도 여전히 없음. 아이콘 10개 전체 폭이
     대략 55px(버튼 36px + 그룹 테두리/패딩)이 되도록 폭을 지정. */
  #mapToolbar {
    flex: none;
    width: 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 8px 4px;
    background: #fff;
    border-left: 1px solid var(--toss-line);
    overflow-y: auto;
  }
  .toolbar-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    background: #fff;
    border: 1px solid var(--toss-line);
    border-radius: 12px;
    padding: 6px;
    box-shadow: 0 1px 6px rgba(25, 31, 40, 0.15);
  }
  /* v2.114: 위성도/지적도/지형도 체크박스를 툴바 안으로 편입.
     v2.144: [요청 반영] 세로 1열로 되돌아온 툴바 안에서, 가로로 넓게 벌어져 있던
     체크박스 3개를 약 70×70px의 정사각형에 가까운 작은 블록으로 압축(글자 크기도
     같이 줄여서 3줄이 그 폭 안에 들어가게 함). */
  /* v2.145: [요청 반영] 체크박스 3개 글자/박스 크기 +1pt(10.3px->11.6px, 11px->12.3px)
     + 가운데 정렬(라벨 자체를 justify-content:center로 중앙 정렬). */
  .toolbar-group.checkbox-group {
    width: 70px;
    align-items: center;
    padding: 6px 5px;
    font-size: 11.6px;
    color: var(--toss-text);
    gap: 4px;
  }
  .toolbar-group.checkbox-group label { display: flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer; white-space: nowrap; }
  .toolbar-group.checkbox-group input { margin: 0; width: 12.3px; height: 12.3px; }
  /* v2.141: [요청 반영] 버튼 10개(현재위치~처음으로)는 작을수록 좋다는 요청에 따라
     v2.140의 44px(일부는 50% 확대해 60px)에서 36px/아이콘 22px로 축소(.toolbar-btn-lg
     확대 규칙은 제거) */
  .toolbar-btn {
    width: 36px;
    height: 36px;
    border: none;
    background: transparent;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }
  .toolbar-btn:hover { background: var(--toss-bg); }
  .toolbar-btn img { width: 22px; height: 22px; display: block; pointer-events: none; }
  .toolbar-btn.active { background: var(--toss-blue); }
  .toolbar-btn.active img { filter: brightness(0) invert(1); }
  .toolbar-btn-text { font-size: 10.5px; color: var(--toss-text); font-family: inherit; font-weight: 600; border: 1px solid var(--toss-line) !important; }
  .toolbar-btn-text.active { color: #fff; border-color: var(--toss-blue) !important; }
  .measure-label {
    background: #191f28;
    color: #fff;
    font-size: 13px;
    padding: 5px 8px;
    border-radius: 6px;
    white-space: nowrap;
    box-shadow: 0 1px 4px rgba(25, 31, 40, 0.2);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .measure-label .measure-close {
    border: none;
    background: rgba(255, 255, 255, 0.25);
    color: #fff;
    width: 22px;
    height: 22px;
    line-height: 22px;
    border-radius: 50%;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    padding: 0;
    flex: none;
  }
  .segment-label {
    background: rgba(25, 31, 40, 0.8);
    color: #fff;
    font-size: 10.5px;
    padding: 1px 5px;
    border-radius: 4px;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div id="topbar">
    <strong>매물on 지도</strong>
    <span id="buildTag">v2.153</span>
    <span id="status">확장 프로그램에서 매물 데이터를 기다리는 중...</span>
  </div>
  <!-- v2.143: [기능 추가] 목록창(popup.html)의 필터바(지역/거래유형·매물종류/검색/
       초기화/㎡)와 목록·지도 전환 버튼(정렬은 자리만)을 지도창에도 동일하게 구현.
       필터는 이미 이 페이지가 로드 시점에 한 번에 받아온 전체 매물 배열(allListings)을
       클라이언트에서 걸러 마커만 다시 그리는 방식이라, 목록창처럼 storage를 다시 읽지
       않아도 됨. -->
  <div id="mapFilterbar">
    <div class="filter-dropdowns">
      <button type="button" id="btnRegionFilter" class="filter-dropdown-btn" title="지역 선택">지역 전체 <span class="dd-caret">▾</span></button>
      <button type="button" id="btnDealTypeFilter" class="filter-dropdown-btn" title="거래유형·매물종류 선택">거래유형·매물종류 전체 <span class="dd-caret">▾</span></button>
    </div>
    <div class="search-group">
      <input type="text" id="searchInput" placeholder="검색어를 입력하세요" />
      <button type="button" id="btnSearch">검색</button>
      <button type="button" id="btnSearchReset" class="btn-reset" title="검색조건 초기화">초기화</button>
      <button type="button" id="btnAreaUnit" class="btn-area-unit" title="면적 단위 표시 전환(㎡ ↔ 평)">⟳ ㎡</button>
    </div>
    <div class="view-switch">
      <button type="button" id="btnSortView" class="view-switch-btn" title="정렬(준비 중)" disabled>⇅</button>
      <button type="button" id="btnGoList" class="view-switch-btn" title="매물목록 열기">목록</button>
      <button type="button" id="btnGoMap" class="view-switch-btn view-switch-active" title="현재 화면" disabled>지도</button>
    </div>
  </div>
  <!-- v2.132/v2.142 popup.html 이식: ①지역 선택 팝업 -->
  <div id="regionFilterPopup" class="filter-popup" style="display:none">
    <div class="filter-popup-breadcrumb" id="regionBreadcrumb"></div>
    <input type="text" id="regionSearchInput" class="filter-popup-search" placeholder="입력해서 찾기" style="display:none" />
    <div class="filter-popup-grid" id="regionGrid"></div>
    <div class="filter-popup-footer">
      <button type="button" id="regionApplyBtn" class="primary">적용</button>
      <button type="button" id="regionResetBtn">초기화</button>
      <button type="button" id="regionCancelBtn">취소</button>
    </div>
  </div>
  <!-- v2.132/v2.142 popup.html 이식: ②③거래유형·매물종류 통합 팝업 -->
  <div id="dealTypeFilterPopup" class="filter-popup" style="display:none">
    <div class="filter-popup-header">
      <button type="button" id="dealTypeResetBtn" title="이 팝업의 선택 초기화">↻ 초기화</button>
      <button type="button" id="dealTypeCloseBtn" title="닫기">✕</button>
    </div>
    <div class="filter-popup-section-title">거래유형</div>
    <div class="filter-chip-grid" id="dealTypeChips"></div>
    <div class="filter-popup-section-title">매물종류</div>
    <div id="propertyTypeChips"></div>
  </div>
  <div id="mapWrap">
    <div id="map"></div>
    <div id="roadviewSplit">
      <div id="roadviewSplitBar">

    async function geocodeAddress(address) {
      const res = await fetch(`https://dapi.kakao.com/v2/local/search/address.json?query=${encodeURIComponent(address)}`, {

      if (!res.ok) return null;
      const data = await res.json();

    let mapInstance = null;

    // resetView=true는 최초 로드 시점에만 사용(v2.110 기준 위치로 시작).

        const marker = new kakao.maps.Marker({ position: pos });
        kakao.maps.event.addListener(marker, "click", () => {

          </div>`;

      // v2.105: 정보창의 "수정창 열기" 버튼은 매번 새로 그려지므로 document 위임 방식으로

      if (currentMarkers.length) {

        // v2.110: [요청 반영] 매물 데이터 기준(평균/밀집지역)으로 첫 화면 위치를
        // 자동 계산하는 방식이 계속 엉뚱한 곳을 잡는 문제가 있어, 사용자가 지정한

      } else {

      // (다음에 열 때는 다시 지오코딩하지 않도록).

    // v2.101: 카카오 공식 사이트의 "지도유형" 체크박스(위성도/지적도/지형도)를

    // v2.101: "현재위치" 버튼 - 브라우저 위치 정보로 지도를 그 위치로 이동하고 마커 표시

    // v2.112: 확대/축소 + 거리재기/면적재기/반경재기. 로드뷰 선택 모드와 서로 배타적으로
    // 동작해야 해서(둘 다 지도 클릭 이벤트를 쓰므로), window.__stopMeasureMode /
    // window.__stopRoadviewSelecting 라는 작은 전역 훅으로 서로를 꺼준다.
    function wireMeasureTools() {
      const btnZoomIn = document.getElementById("btnZoomIn");
      const btnZoomOut = document.getElementById("btnZoomOut");
      const btnDistance = document.getElementById("btnDistance");
      const btnArea = document.getElementById("btnArea");
      const btnRadius = document.getElementById("btnRadius");

      btnZoomIn.addEventListener("click", () => mapInstance.setLevel(mapInstance.getLevel() - 1));
      btnZoomOut.addEventListener("click", () => mapInstance.setLevel(mapInstance.getLevel() + 1));

      function distanceMeters(a, b) {
        const R = 6371000;
        const toRad = (d) => (d * Math.PI) / 180;
        const dLat = toRad(b.getLat() - a.getLat());
        const dLng = toRad(b.getLng() - a.getLng());
        const lat1 = toRad(a.getLat());
        const lat2 = toRad(b.getLat());
        const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
        return 2 * R * Math.asin(Math.sqrt(h));
      }
      function fmtDist(m) {
        return m >= 1000 ? `${(m / 1000).toFixed(2)}km` : `${m.toFixed(1)}m`;
      }
      // 폴리곤 면적 계산용: 평균위도를 기준으로 위경도를 근사 평면좌표(m)로 변환 후 신발끈 공식 적용.
      function toXY(pos, refLat) {
        const R = 6371000;
        const toRad = (d) => (d * Math.PI) / 180;
        return {
          x: toRad(pos.getLng()) * R * Math.cos(toRad(refLat)),
          y: toRad(pos.getLat()) * R,
        };
      }
      function polygonAreaM2(points) {
        if (points.length < 3) return 0;
        const refLat = points.reduce((s, p) => s + p.getLat(), 0) / points.length;
        const xy = points.map((p) => toXY(p, refLat));
        let sum = 0;
        for (let i = 0; i < xy.length; i++) {
          const a = xy[i];
          const b = xy[(i + 1) % xy.length];
          sum += a.x * b.y - b.x * a.y;
        }
        return Math.abs(sum) / 2;
      }
      function fmtArea(m2) {
        return `${m2.toFixed(1)}㎡ (${(m2 / 3.3058).toFixed(1)}평)`;
      }

      const vertexImage = new kakao.maps.MarkerImage(
        "data:image/svg+xml;charset=UTF-8," +
          encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10"><circle cx="5" cy="5" r="4" fill="#3182f6" stroke="#fff" stroke-width="1.5"/></svg>'),
        new kakao.maps.Size(10, 10),
      );

      // 도구별 상태는 서로 독립적으로 유지한다(도구를 바꿔도 다른 도구가 그려둔
      // 도형은 지워지지 않고, 같은 도구를 다시 눌렀을 때만 새로 시작하며 지운다).
      function createToolState() {
        return { points: [], vertexMarkers: [], shape: null, rubber: null, label: null, segmentLabels: [] };
      }
      const state = { distance: createToolState(), area: createToolState(), radius: { center: null, circle: null, marker: null, label: null } };
      let mode = null; // 'distance' | 'area' | 'radius' | null
      let suppressMapClick = false; // v2.115: 닫기(×) 버튼 클릭이 지도 클릭으로 새어나가 점이 추가되는 것을 막는 플래그
      const buttons = { distance: btnDistance, area: btnArea, radius: btnRadius };

      function clearLabel(st) {
        if (st.label) { st.label.setMap(null); st.label = null; }
      }
      // v2.113: 라벨에 "닫기(×)" 버튼을 함께 넣어, 도구를 다시 클릭하지 않고도
      // 그 자리에서 바로 측정 결과를 지울 수 있게 한다. onClose는 closeTool()로 연결.
      function showLabel(st, pos, text, onClose) {
        if (!st.label) {
          st.label = new kakao.maps.CustomOverlay({ position: pos, xAnchor: 0, yAnchor: 1.4, zIndex: 30 });
          st.label.setMap(mapInstance);
        } else {
          st.label.setPosition(pos);
        }
        const el = document.createElement("div");
        el.className = "measure-label";
        const span = document.createElement("span");
        span.textContent = text;
        const closeBtn = document.createElement("button");
        closeBtn.type = "button";
        closeBtn.className = "measure-close";
        closeBtn.textContent = "×";
        closeBtn.title = "닫기";
        // v2.115: [버그 수정] 반경재기는 X를 눌러도 잘 꺼지는데 거리재기/면적재기는 안
        // 꺼지는 문제 - 카카오맵이 "클릭"을 판정하는 시점이 브라우저의 click 이벤트보다
        // 이를 수 있어서(mousedown 시점에 이미 지도쪽에서 클릭으로 처리해버림),
        // click에서만 stopPropagation해서는 늦을 수 있음. mousedown 단계에서부터
        // suppressMapClick 플래그를 세워, 지도의 click 핸들러 맨 앞에서 이를 확인해
        // 걸러내는 이중 방어 장치를 추가.
        closeBtn.addEventListener("mousedown", (ev) => { ev.stopPropagation(); suppressMapClick = true; });
        closeBtn.addEventListener("click", (ev) => { ev.stopPropagation(); onClose(); });
        el.appendChild(span);
        el.appendChild(closeBtn);
        st.label.setContent(el);
      }
      function clearSegmentLabels(st) {
        st.segmentLabels.forEach((ov) => ov.setMap(null));
        st.segmentLabels = [];
      }
      // v2.113: [기능 추가] 총 합계뿐 아니라 각 구간(변)의 길이도 그 구간 중점에 작게 표시.
      function updateSegmentLabels(st, closeLoop) {
        clearSegmentLabels(st);
        const pts = st.points;
        const segCount = closeLoop ? pts.length : pts.length - 1;
        for (let i = 0; i < segCount; i++) {
          const a = pts[i];
          const b = pts[(i + 1) % pts.length];
          const d = distanceMeters(a, b);
          const mid = new kakao.maps.LatLng((a.getLat() + b.getLat()) / 2, (a.getLng() + b.getLng()) / 2);
          const ov = new kakao.maps.CustomOverlay({ position: mid, zIndex: 25 });
          const el = document.createElement("div");
          el.className = "segment-label";
          el.textContent = fmtDist(d);
          ov.setContent(el);
          ov.setMap(mapInstance);
          st.segmentLabels.push(ov);
        }
      }
      function resetLineOrPolyState(st) {
        st.vertexMarkers.forEach((m) => m.setMap(null));
        st.vertexMarkers = [];
        st.points = [];
        if (st.shape) { st.shape.setMap(null); st.shape = null; }
        if (st.rubber) { st.rubber.setMap(null); st.rubber = null; }
        clearLabel(st);
        clearSegmentLabels(st);
      }
      function resetRadiusState() {
        if (state.radius.circle) { state.radius.circle.setMap(null); state.radius.circle = null; }
        if (state.radius.marker) { state.radius.marker.setMap(null); state.radius.marker = null; }
        clearLabel(state.radius);
        state.radius.center = null;
      }
      // v2.113: [기능 추가] 라벨의 "×" 버튼이나 도구를 다시 눌렀을 때, 해당 도구의
      // 도형/라벨을 완전히 지운다(측정 중이었다면 모드도 함께 종료).
      function closeTool(name) {
        if (mode === name) stopMode();
        if (name === "radius") resetRadiusState();
        else resetLineOrPolyState(state[name]);
      }

      function stopMode() {
        if (mode && buttons[mode]) buttons[mode].classList.remove("active");
        mode = null;
        document.getElementById("map").style.cursor = "";
      }
      window.__stopMeasureMode = stopMode;

      function startMode(next) {
        if (mode === next) { stopMode(); return; }
        if (window.__stopRoadviewSelecting) window.__stopRoadviewSelecting();
        stopMode();
        mode = next;
        buttons[next].classList.add("active");
        document.getElementById("map").style.cursor = "crosshair";
        if (next === "distance" || next === "area") resetLineOrPolyState(state[next]);
        else resetRadiusState();
      }
      btnDistance.addEventListener("click", () => startMode("distance"));
      btnArea.addEventListener("click", () => startMode("area"));
      btnRadius.addEventListener("click", () => startMode("radius"));

      kakao.maps.event.addListener(mapInstance, "click", (e) => {
        if (suppressMapClick) { suppressMapClick = false; return; }
        if (!mode) return;
        const pos = e.latLng;
        if (mode === "radius") {
          if (!state.radius.center) {
            state.radius.center = pos;
            state.radius.marker = new kakao.maps.Marker({ position: pos, image: vertexImage, map: mapInstance });
            state.radius.circle = new kakao.maps.Circle({
              center: pos, radius: 1, strokeWeight: 2, strokeColor: "#3182f6", strokeOpacity: 0.9,
              fillColor: "#3182f6", fillOpacity: 0.15, map: mapInstance,
            });
          } else {
            // v2.140: [버그 수정] 라벨(닫기 × 버튼 포함)이 mousemove 핸들러에서만
            // 그려지고 있어서, 두 번째 클릭(반경 확정) 전에 마우스를 전혀 움직이지
            // 않으면(예: 빠르게 두 번 클릭) 닫기 버튼이 한 번도 표시되지 않는 문제가
            // 있었다 - 거리재기/면적재기처럼 클릭 시점에도 직접 showLabel을 호출해서
            // 마우스 움직임과 무관하게 항상 닫기 버튼이 뜨도록 함.
            const center = state.radius.center;
            const r = distanceMeters(center, pos);
            state.radius.circle.setRadius(r);
            showLabel(state.radius, pos, `반경 ${fmtDist(r)} (면적 ${fmtArea(Math.PI * r * r)})`, () => closeTool("radius"));
            state.radius.center = null; // 반경 확정, 다음 클릭부터 새 원 시작
          }
          return;
        }
        const st = state[mode];
        st.points.push(pos);
        st.vertexMarkers.push(new kakao.maps.Marker({ position: pos, image: vertexImage, map: mapInstance }));
        if (mode === "distance") {
          if (!st.shape) st.shape = new kakao.maps.Polyline({ path: st.points, strokeWeight: 3, strokeColor: "#3182f6", strokeOpacity: 0.9, map: mapInstance });
          else st.shape.setPath(st.points);
          if (st.points.length > 1) {
            let total = 0;
            for (let i = 1; i < st.points.length; i++) total += distanceMeters(st.points[i - 1], st.points[i]);
            showLabel(st, pos, `총 거리 ${fmtDist(total)}`, () => closeTool("distance"));
            updateSegmentLabels(st, false);
          }
        } else if (mode === "area") {
          if (st.points.length >= 3) {
            if (st.shape instanceof kakao.maps.Polygon) {
              st.shape.setPath(st.points);
            } else {
              if (st.shape) st.shape.setMap(null);
              st.shape = new kakao.maps.Polygon({ path: st.points, strokeWeight: 2, strokeColor: "#3182f6", strokeOpacity: 0.9, fillColor: "#3182f6", fillOpacity: 0.15, map: mapInstance });
            }
            showLabel(st, pos, `면적 ${fmtArea(polygonAreaM2(st.points))}`, () => closeTool("area"));
            updateSegmentLabels(st, true);
          } else {
            if (!st.shape) st.shape = new kakao.maps.Polyline({ path: st.points, strokeWeight: 2, strokeColor: "#3182f6", strokeOpacity: 0.9, map: mapInstance });
            else st.shape.setPath(st.points);
          }
        }
      });

      kakao.maps.event.addListener(mapInstance, "mousemove", (e) => {
        if (!mode) return;
        const pos = e.latLng;
        if (mode === "radius") {
          if (!state.radius.center || !state.radius.circle) return;
          const r = distanceMeters(state.radius.center, pos);
          state.radius.circle.setRadius(r);
          showLabel(state.radius, pos, `반경 ${fmtDist(r)} (면적 ${fmtArea(Math.PI * r * r)})`, () => closeTool("radius"));
        } else {
          const st = state[mode];
          if (!st.points.length) return;
          const path = st.points.concat([pos]);
          if (!st.rubber) st.rubber = new kakao.maps.Polyline({ path, strokeWeight: 2, strokeColor: "#3182f6", strokeOpacity: 0.5, strokeStyle: "shortdash", map: mapInstance });
          else st.rubber.setPath(path);
        }
      });
    }

    // v2.105: "로드뷰(선택)" - 켜면 도로 위에 파란선(로드뷰 지원 구간)이 표시되고,
    // 그 선을 클릭하면 화면이 왼쪽(지도)/오른쪽(로드뷰) 절반씩 나뉘어 크게 보인다.
    // 로드뷰 사진 안에서 이동/회전하면(position_changed) 지도 위 빨간 점이 같이
    // 움직이고, 반대로 지도의 파란선을 다시 클릭하면 로드뷰 사진이 그 위치로 바뀐다.
    function wireRoadview() {
      const btn = document.getElementById("btnRoadview");
      const split = document.getElementById("roadviewSplit");
      const inner = document.getElementById("roadviewInner");
      const closeBtn = document.getElementById("roadviewClose");
      const roadviewClient = new kakao.maps.RoadviewClient();
      const roadviewMarkerImage = new kakao.maps.MarkerImage(
        "data:image/svg+xml;charset=UTF-8," +
          encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"><circle cx="11" cy="11" r="8" fill="#f04452" stroke="#fff" stroke-width="3"/></svg>'),
        new kakao.maps.Size(22, 22),
      );
      let roadview = null;
      let roadviewMarker = null;
      let selecting = false;

      // v2.108: [버그 수정 아님, 요청 반영] "빨간 점을 화면 정중앙에 맞추는" 시도가
      // 아니라, 로드뷰와의 경계선으로부터 왼쪽으로 일정 거리(약 5~7cm) 띄운
      // 위치에 항상 오도록 지도를 의도적으로 오른쪽으로 치우쳐 센터를 잡는다.
      const ROADVIEW_MARKER_LEFT_OFFSET_PX = 220; // 화면 96dpi 기준 약 6cm

      function relayoutMap() {
        // v2.107: [버그 수정] "resize" 이벤트를 강제로 흘려보내는 방식은 실제로
        // 카카오맵에 아무 효과가 없었음(진짜 리레이아웃 함수가 아님) - 지도
        // 컨테이너 크기가 바뀌었을 때 다시 계산해주는 진짜 함수(map.relayout())로 교체.
        mapInstance.relayout();
      }

      // v2.108: pos가 지도의 "정중앙"이 아니라, 오른쪽 경계선에서 왼쪽으로
      // ROADVIEW_MARKER_LEFT_OFFSET_PX만큼 떨어진 지점에 오도록 하는 중심좌표 계산.
      function roadviewCenterFor(pos) {
        const mapEl = document.getElementById("map");
        const w = mapEl.clientWidth;
        const proj = mapInstance.getProjection();
        const centerPoint = proj.pointFromCoords(pos);
        centerPoint.x -= (w / 2 - ROADVIEW_MARKER_LEFT_OFFSET_PX);
        return proj.coordsFromPoint(centerPoint);
      }
      function stopSelecting() {
        selecting = false;
        btn.classList.remove("active");
        document.getElementById("map").style.cursor = "";
        mapInstance.removeOverlayMapTypeId(kakao.maps.MapTypeId.ROADVIEW);
      }
      function closeRoadview() {
        split.style.display = "none";
        if (roadviewMarker) { roadviewMarker.setMap(null); roadviewMarker = null; }
        roadview = null;
        relayoutMap();
        stopSelecting();
      }

      btn.addEventListener("click", () => {
        if (selecting) { stopSelecting(); return; }
        if (window.__stopMeasureMode) window.__stopMeasureMode();
        selecting = true;
        btn.classList.add("active");
        document.getElementById("map").style.cursor = "crosshair";
        mapInstance.addOverlayMapTypeId(kakao.maps.MapTypeId.ROADVIEW);
      });
      closeBtn.addEventListener("click", closeRoadview);
      window.__stopRoadviewSelecting = stopSelecting;

      function showRoadviewAt(pos, panoId) {
        const wasHidden = split.style.display !== "flex";
        split.style.display = "flex";
        if (wasHidden) {
          // v2.106: [버그 수정] 화면을 절반으로 나누자마자(display:flex) 바로
          // 리레이아웃/센터 이동을 하면, 브라우저가 아직 실제 레이아웃(폭 변경)을
          // 반영하기 전이라 카카오맵이 "옛날 넓이" 기준으로 계산해서 빨간 점이
          // 화면 중앙이 아니라 오른쪽 경계 쪽에 쏠려 보이던 문제 - 브라우저가
          // 레이아웃을 실제로 끝낸 다음 프레임에 다시 계산하도록 미룸.
          requestAnimationFrame(() => {
            relayoutMap();
            mapInstance.setCenter(roadviewCenterFor(pos));
          });
        } else {
          relayoutMap();
          mapInstance.setCenter(roadviewCenterFor(pos));
        }
        if (!roadview) {
          roadview = new kakao.maps.Roadview(inner);
          kakao.maps.event.addListener(roadview, "position_changed", () => {
            const p = roadview.getPosition();
            if (!roadviewMarker) {
              roadviewMarker = new kakao.maps.Marker({ position: p, map: mapInstance, image: roadviewMarkerImage });
            } else {
              roadviewMarker.setPosition(p);
            }
            mapInstance.panTo(roadviewCenterFor(p));
          });
        }
        roadview.setPanoId(panoId, pos);
      }

      kakao.maps.event.addListener(mapInstance, "click", (mouseEvent) => {
        if (!selecting) return;
        const pos = mouseEvent.latLng;
        // v2.102: 탐색 반경 50m가 너무 좁아 거의 항상 "지원하지 않음"으로 실패하던
        // 문제 - 300m로 넓혀서 도로에서 조금 벗어나 클릭해도 찾도록 함.
        roadviewClient.getNearestPanoId(pos, 300, (panoId) => {
          if (!panoId) { alert("이 위치는 로드뷰를 지원하지 않습니다."); return; }
          showRoadviewAt(pos, panoId);
        });
      });

      new ResizeObserver(() => { if (roadview) roadview.relayout(); }).observe(split);
    }

    // ===================== v2.143: 필터바(지역/거래유형·매물종류/검색) =====================
    // popup.js의 동일 기능(v2.132~v2.142)을 이 페이지용으로 이식. 목록창은 chrome.storage를
    // 실시간 구독해서 다시 읽지만, 이 지도창은 페이지 로드 시점에 한 번 받아온 전체 배열
    // (allListings)을 그대로 두고 클라이언트에서 걸러서 마커만 다시 그린다(목록창처럼
    // storage를 다시 읽을 필요가 없어 오히려 더 간단함).
    let allListings = [];
    let currentQuery = "";
    let selectedRegion = { sido: "", sgg: "", emdSet: new Set() };
    let selectedDealTypes = new Set();
    let selectedPropertyTypes = new Set();
    let areaUnit = "pyeong";

    const PROPERTY_TYPE_GROUPS = [
      ["아파트", "재건축", "오피스텔", "빌라", "아파트분양권", "오피스텔분양권", "원룸", "단독/다가구", "전원주택", "상가주택", "재개발"],
      ["상가", "토지", "사무실", "건물", "공장/창고", "지식산업센터"],
    ];
    const PROPERTY_TYPE_LABELS = {
      "빌라": "연립빌라다세대", "원룸": "원룸투룸", "건물": "빌딩건물", "토지": "대지임야전답", "상가": "상가점포",
    };
    const DEAL_TYPE_ITEMS = ["매매", "전세", "월세", "단기임대"];
    const SIDO_SHORT_NAME = {
      "서울특별시": "서울", "경기도": "경기", "인천광역시": "인천", "부산광역시": "부산",
      "대전광역시": "대전", "대구광역시": "대구", "울산광역시": "울산", "세종특별자치시": "세종",
      "전남광주통합특별시": "전남광주", "강원특별자치도": "강원", "충청북도": "충북", "충청남도": "충남",
      "경상북도": "경북", "경상남도": "경남", "전북특별자치도": "전북", "제주특별자치도": "제주",
    };
    const SIDO_ORDER = [
      "서울특별시", "경기도", "인천광역시", "부산광역시", "대전광역시", "대구광역시",
      "울산광역시", "세종특별자치시", "전남광주통합특별시", "강원특별자치도", "충청북도",
      "충청남도", "경상북도", "경상남도", "전북특별자치도", "제주특별자치도",
    ];
    function sortKo(arr) { return [...arr].sort((a, b) => a.localeCompare(b, "ko")); }

    // v2.143: [알려진 제한, 명시] 목록창의 검색(matchesQuery)은 엑셀 전체 컬럼(COLUMN_DEFS)을
    // 대상으로 하지만, 이 페이지는 COLUMN_DEFS를 안 갖고 있어 마커 정보창에 쓰는 핵심
    // 필드 몇 개로만 검색한다(제목/매물소개/타이틀/거래유형/매물종류/지번/전체주소/지역/중개사).
    function matchesMapQuery(rec, q) {
      if (!q) return true;
      const haystack = [rec["제목"], rec["매물소개"], rec["타이틀"], rec["거래유형"], rec["매물종류"], rec["지번"], rec["전체주소"], rec["지역"], rec["중개사"], rec["중개사(2)"]]
        .filter(Boolean).join(" ").toLowerCase();
      return haystack.includes(q);
    }
    function computeFilteredListings() {
      const q = currentQuery.trim().toLowerCase();
      let pool = allListings.filter((rec) => matchesMapQuery(rec, q));
      // v2.132 원본과 동일: 구조화된 지역코드가 매물 데이터에 없어 전체주소/지역
      // 문자열에 선택한 시군구·읍면동명이 포함되는지로 매칭.
      if (selectedRegion.sgg) {
        pool = pool.filter((rec) => {
          const addr = `${rec["전체주소"] || ""} ${rec["지역"] || ""}`;
          if (!addr.includes(selectedRegion.sgg)) return false;
          if (selectedRegion.emdSet.size === 0) return true;
          return [...selectedRegion.emdSet].some((emd) => addr.includes(emd));
        });
      }
      if (selectedDealTypes.size) pool = pool.filter((rec) => selectedDealTypes.has(rec["거래유형"]));
      if (selectedPropertyTypes.size) {
        pool = pool.filter((rec) => {
          const t = rec["매물종류"] || "";
          return [...selectedPropertyTypes].some((sel) => t.includes(sel));
        });
      }
      return pool;
    }
    // v2.143: 필터를 바꿀 때마다 압구정역(기본 위치)으로 화면이 튀면 불편하므로,
    // 필터 조작으로 인한 재렌더링은 항상 resetView=false(현재 보던 위치/확대 유지).
    function refreshMapFilterView(resetView) {
      renderListings(computeFilteredListings(), !!resetView);
    }

    document.getElementById("btnSearch").addEventListener("click", () => {
      currentQuery = document.getElementById("searchInput").value;
      refreshMapFilterView(false);
    });
    document.getElementById("searchInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("btnSearch").click();
    });
    function updateAreaUnitButton() {
      document.getElementById("btnAreaUnit").textContent = areaUnit === "pyeong" ? "⟳ ㎡" : "⟳ 평";
    }
    document.getElementById("btnAreaUnit").addEventListener("click", () => {
      // v2.143: [알려진 제한] 지도 마커 정보창엔 면적 항목이 없어서, 목록창과 달리
      // 지금은 버튼 표시(단위 전환 라벨)만 동일하게 두고 실제 화면 변화는 없음.
      areaUnit = areaUnit === "pyeong" ? "sqm" : "pyeong";
      updateAreaUnitButton();
    });
    updateAreaUnitButton();

    document.getElementById("btnSearchReset").addEventListener("click", () => {
      currentQuery = "";
      document.getElementById("searchInput").value = "";
      selectedRegion = { sido: "", sgg: "", emdSet: new Set() };
      selectedDealTypes = new Set();
      selectedPropertyTypes = new Set();
      updateRegionButtonLabel();
      updateDealTypeButtonLabel();
      refreshMapFilterView(false);
    });

    // ===== ①지역선택 팝업(popup.js openRegionPopup 계열 이식) =====
    const regionPopupEl = document.getElementById("regionFilterPopup");
    const regionBreadcrumbEl = document.getElementById("regionBreadcrumb");
    const regionGridEl = document.getElementById("regionGrid");
    let regionNav = { sido: "", sgg: "", emdSet: new Set() };

    function updateRegionButtonLabel() {
      const btn = document.getElementById("btnRegionFilter");
      if (!selectedRegion.sgg) {
        btn.innerHTML = `지역 전체 <span class="dd-caret">▾</span>`;
        btn.classList.remove("filter-dropdown-selected");
        return;
      }
      const emds = [...selectedRegion.emdSet];
      let label = SIDO_SHORT_NAME[selectedRegion.sgg] || selectedRegion.sgg;
      if (emds.length === 1) label += ` ${emds[0]}`;
      else if (emds.length > 1) label += ` ${emds[0]} +${emds.length - 1}`;
      btn.innerHTML = `${esc(label)} <span class="dd-caret">▾</span>`;
      btn.classList.add("filter-dropdown-selected");
    }
    function sggKeysOf(sido) {
      const node = REGION_DB[sido];
      if (!node) return [];
      return Object.keys(node.sgg);
    }
    function directEmdOnly(sido) {
      const keys = sggKeysOf(sido);
      return keys.length === 1 && keys[0] === "";
    }
    const regionSearchEl = document.getElementById("regionSearchInput");
    regionSearchEl.addEventListener("input", () => {
      const q = regionSearchEl.value.trim();
      regionGridEl.querySelectorAll("button").forEach((b) => {
        b.classList.toggle("hidden-by-search", q && !b.textContent.includes(q));
      });
    });
    function renderRegionPopup() {
      regionSearchEl.style.display = "none";
      regionSearchEl.value = "";
      const crumbs = [];
      crumbs.push(regionNav.sido
        ? `<span class="crumb-link" data-level="sido">${esc(SIDO_SHORT_NAME[regionNav.sido] || regionNav.sido)}</span>`
        : "시·도");
      crumbs.push(regionNav.sido && !directEmdOnly(regionNav.sido)
        ? (regionNav.sgg ? `<span class="crumb-link" data-level="sgg">${esc(regionNav.sgg)}</span>` : "시·군·구 선택")
        : null);
      crumbs.push((regionNav.sido && (directEmdOnly(regionNav.sido) || regionNav.sgg)) ? "읍·면·동 선택(여러 개 가능)" : null);
      regionBreadcrumbEl.innerHTML = crumbs.filter(Boolean).join(" &rsaquo; ");

      regionGridEl.innerHTML = "";

      if (!regionNav.sido) {
        SIDO_ORDER.filter((sido) => REGION_DB[sido]).forEach((sido) => {
          const b = document.createElement("button");
          b.type = "button";
          b.textContent = SIDO_SHORT_NAME[sido] || sido;
          b.addEventListener("click", () => {
            regionNav = { sido, sgg: "", emdSet: new Set() };
            renderRegionPopup();
          });
          regionGridEl.appendChild(b);
        });
        return;
      }
      if (!directEmdOnly(regionNav.sido) && !regionNav.sgg) {
        sortKo(sggKeysOf(regionNav.sido)).forEach((sgg) => {
          const b = document.createElement("button");
          b.type = "button";
          b.textContent = sgg;
          b.addEventListener("click", () => {
            regionNav.sgg = sgg;
            regionNav.emdSet = new Set();
            renderRegionPopup();
          });
          regionGridEl.appendChild(b);
        });
        return;
      }
      const sggKey = directEmdOnly(regionNav.sido) ? "" : regionNav.sgg;
      const emdMap = REGION_DB[regionNav.sido].sgg[sggKey].emd;
      regionSearchEl.style.display = "block";
      sortKo(Object.keys(emdMap)).forEach((emd) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = emd;
        if (regionNav.emdSet.has(emd)) b.classList.add("selected");
        b.addEventListener("click", () => {
          if (regionNav.emdSet.has(emd)) regionNav.emdSet.delete(emd);
          else regionNav.emdSet.add(emd);
          renderRegionPopup();
        });
        regionGridEl.appendChild(b);
      });
    }
    regionBreadcrumbEl.addEventListener("click", (e) => {
      const link = e.target.closest(".crumb-link");
      if (!link) return;
      if (link.dataset.level === "sido") regionNav = { sido: "", sgg: "", emdSet: new Set() };
      else if (link.dataset.level === "sgg") { regionNav.sgg = ""; regionNav.emdSet = new Set(); }
      renderRegionPopup();
    });
    function openRegionPopup() {
      // v2.145: [진단 개선] 이 버튼을 눌러도 아무 반응이 없다는 보고가 있었음 - 가장
      // 유력한 원인은 region-db.js가 GitHub Pages 저장소(kakao-map.html과 같은 곳)에
      // 아직 업로드되지 않은 경우: 그러면 REGION_DB가 정의되지 않아 renderRegionPopup()
      // 안에서 조용히(콘솔에만) 오류가 나며 팝업이 안 뜬다 - 화면에 원인을 바로 보여줌.
      if (typeof REGION_DB === "undefined") {
        alert("지역 데이터(region-db.js)를 불러오지 못했습니다.\nGitHub Pages 저장소(hic71991-0928/maemulon-map)에 kakao-map.html과 함께 region-db.js 파일도 업로드되어 있는지 확인해 주세요.");
        return;
      }
      regionNav = { sido: selectedRegion.sido, sgg: selectedRegion.sgg, emdSet: new Set(selectedRegion.emdSet) };
      renderRegionPopup();
      const rect = document.getElementById("btnRegionFilter").getBoundingClientRect();
      regionPopupEl.style.left = Math.max(4, rect.left) + "px";
      regionPopupEl.style.top = (rect.bottom + 4) + "px";
      regionPopupEl.style.display = "block";
    }
    function closeRegionPopup() { regionPopupEl.style.display = "none"; }
    document.getElementById("btnRegionFilter").addEventListener("click", () => {
      if (regionPopupEl.style.display === "none") openRegionPopup();
      else closeRegionPopup();
    });
    document.getElementById("regionCancelBtn").addEventListener("click", closeRegionPopup);
    document.getElementById("regionResetBtn").addEventListener("click", () => {
      selectedRegion = { sido: "", sgg: "", emdSet: new Set() };
      updateRegionButtonLabel();
      closeRegionPopup();
      refreshMapFilterView(false);
    });
    document.getElementById("regionApplyBtn").addEventListener("click", () => {
      if (!regionNav.sgg && !directEmdOnly(regionNav.sido)) {
        alert("시·군·구까지는 선택해 주세요.");
        return;
      }
      const sggForMatch = directEmdOnly(regionNav.sido) ? regionNav.sido : regionNav.sgg;
      selectedRegion = { sido: regionNav.sido, sgg: sggForMatch, emdSet: new Set(regionNav.emdSet) };
      updateRegionButtonLabel();
      closeRegionPopup();
      refreshMapFilterView(false);
    });
    document.addEventListener("mousedown", (e) => {
      if (regionPopupEl.style.display === "none") return;
      if (regionPopupEl.contains(e.target)) return;
      if (e.target.closest("#btnRegionFilter")) return;
      closeRegionPopup();
    });

    // ===== ②③거래유형·매물종류 통합 팝업(popup.js openDealTypePopup 계열 이식) =====
    const dealTypePopupEl = document.getElementById("dealTypeFilterPopup");
    function updateDealTypeButtonLabel() {
      const btn = document.getElementById("btnDealTypeFilter");
      const parts = [];
      if (selectedDealTypes.size) parts.push([...selectedDealTypes].join(", "));
      if (selectedPropertyTypes.size) {
        const arr = [...selectedPropertyTypes].map((t) => PROPERTY_TYPE_LABELS[t] || t);
        parts.push(arr.length > 1 ? `${arr[0]} +${arr.length - 1}` : arr[0]);
      }
      if (!parts.length) {
        btn.innerHTML = `거래유형·매물종류 전체 <span class="dd-caret">▾</span>`;
        btn.classList.remove("filter-dropdown-selected");
        return;
      }
      btn.innerHTML = `${esc(parts.join(" / "))} <span class="dd-caret">▾</span>`;
      btn.classList.add("filter-dropdown-selected");
    }
    function renderDealTypeChips() {
      const dealEl = document.getElementById("dealTypeChips");
      dealEl.innerHTML = DEAL_TYPE_ITEMS.map((t) =>
        `<button type="button" data-kind="deal" data-val="${esc(t)}" class="${selectedDealTypes.has(t) ? "selected" : ""}">${esc(t)}</button>`
      ).join("");
      const propEl = document.getElementById("propertyTypeChips");
      propEl.innerHTML = PROPERTY_TYPE_GROUPS.map((items) =>
        `<div class="filter-chip-grid">${items.map((t) =>
          `<button type="button" data-kind="property" data-val="${esc(t)}" class="${selectedPropertyTypes.has(t) ? "selected" : ""}">${esc(PROPERTY_TYPE_LABELS[t] || t)}</button>`
        ).join("")}</div>`
      ).join("");
    }
    dealTypePopupEl.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-kind]");
      if (!btn) return;
      const set = btn.dataset.kind === "deal" ? selectedDealTypes : selectedPropertyTypes;
      if (set.has(btn.dataset.val)) set.delete(btn.dataset.val); else set.add(btn.dataset.val);
      btn.classList.toggle("selected");
      updateDealTypeButtonLabel();
      refreshMapFilterView(false);
    });
    function openDealTypePopup() {
      renderDealTypeChips();
      const rect = document.getElementById("btnDealTypeFilter").getBoundingClientRect();
      dealTypePopupEl.style.left = Math.max(4, rect.left) + "px";
      dealTypePopupEl.style.top = (rect.bottom + 4) + "px";
      dealTypePopupEl.style.display = "block";
    }
    function closeDealTypePopup() { dealTypePopupEl.style.display = "none"; }
    document.getElementById("btnDealTypeFilter").addEventListener("click", () => {
      if (dealTypePopupEl.style.display === "none") openDealTypePopup();
      else closeDealTypePopup();
    });
    document.getElementById("dealTypeCloseBtn").addEventListener("click", closeDealTypePopup);
    document.getElementById("dealTypeResetBtn").addEventListener("click", () => {
      selectedDealTypes = new Set();
      selectedPropertyTypes = new Set();
      renderDealTypeChips();
      updateDealTypeButtonLabel();
      refreshMapFilterView(false);
    });
    document.addEventListener("mousedown", (e) => {
      if (dealTypePopupEl.style.display === "none") return;
      if (dealTypePopupEl.contains(e.target)) return;
      if (e.target.closest("#btnDealTypeFilter")) return;
      closeDealTypePopup();
    });

    // ===== v2.143: [기능 추가] "목록" 버튼 - 목록창(popup.html)을 새로 연다.
    // background.js에 새 메시지 타입(maemulon-open-list) 추가가 필요(별도 커밋).
    // "지도" 버튼은 이미 지도창이므로 view-switch-active + disabled로 현재 화면만 표시.
    // "정렬" 버튼은 이번엔 자리만(disabled), 기능은 다음 작업에서 구현. =====
    document.getElementById("btnGoList").addEventListener("click", () => {
      sendToExtension({ type: "maemulon-open-list" });
    });

    async function main() {
      try {
        await loadKakaoSdk();
      } catch (e) {
        setStatus("카카오맵 SDK를 불러오지 못했습니다. 키 또는 카카오 콘솔의 Web 플랫폼(도메인) 등록을 확인해주세요.", true);
        return;
      }
      kakao.maps.load(async () => {
        mapInstance = new kakao.maps.Map(document.getElementById("map"), {
          center: new kakao.maps.LatLng(DEFAULT_MAP_LAT, DEFAULT_MAP_LNG), // 매물이 없을 때 기본 중심(압구정역)
          level: DEFAULT_MAP_LEVEL,
        });
        // v2.101: 기본값을 지적편집도(지번지도)로 고정해서 켜둠(체크박스도 기본 체크)
        mapInstance.addOverlayMapTypeId(kakao.maps.MapTypeId.USE_DISTRICT);
        wireLayerControl();
        wireLocateButton();
        wireHomeButton();
        wireMeasureTools();
        wireRoadview();

        if (!EXT_ID) {
          setStatus("이 페이지는 매물on 확장 프로그램의 '지도보기' 버튼으로 열어야 동작합니다.", true);
          return;
        }
        const response = await sendToExtension({ type: "maemulon-ready" });
        if (response && Array.isArray(response.list)) {
          allListings = response.list;
          refreshMapFilterView(true); // v2.143: 필터 없는 최초 로드 = 전체 목록, 기본 위치로 시작
        } else setStatus("확장 프로그램에서 매물 데이터를 받아오지 못했습니다." + (lastSendError ? ` (사유: ${lastSendError})` : ""), true);
      });
    }

    main();
  </script>
</body>
</html>
